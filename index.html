<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3f3fb">
<meta name="description" content="Learning games for little kids, hosted by Pip the parrot.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* standalone app: keep clear of phone notches and home bars */
body { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
</style>
<title>Little Hands Playroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a one-screen app with three screens (welcome, game shelf, game). Pip the parrot is the guide who talks;
   a speech bubble mirrors every spoken line. Deliberately one bright light theme for small kids. */
:root {
  color-scheme: light;
  --bg: #e3f3fb;
  --bg2: #cfeaf6;
  --ink: #22324a;
  --muted: #5a6c82;
  --card: #ffffff;
  --edge: #c4dcea;
  --accent: #ff7440;
  --accent-ink: #ffffff;
  --sun: #ffc83a;
  --good: #3fbf6a;
  --sel: #22324a;
  --t1: #ff8a5c; --t2: #4ab3ff; --t3: #b27cff; --t4: #3fc58a; --t5: #ffbf2e; --t6: #ff6f9c; --t7: #2ec4c4; --t8: #8f7cff; --t9: #ff9f5a;
  --f-display: "Grandstander", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --f-body: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-letter: "Andika", "Lexend", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overscroll-behavior: none; }
#app { touch-action: manipulation; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4;
  padding-inline: 16px; padding-block: 12px; -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button { font-family: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, label:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; position: relative; overflow-x: clip; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; }

/* ---------- Pip ---------- */
.pip { width: 64px; height: 64px; flex: 0 0 auto; overflow: visible; }
.pip.big { width: 170px; height: 170px; }
/* Pip the parrot: idle life everywhere, more on the home screens */
.pip .p-body { transform-origin: 50px 92px; animation: p-idle 2.6s ease-in-out infinite; }
.pip .p-eyes { transform-origin: 50px 34px; animation: p-blink 4.6s infinite; }
.pip .p-crest { transform-origin: 50px 21px; animation: p-crest 3.2s ease-in-out infinite; }
.pip .p-tail { transform-origin: 50px 80px; animation: p-tail 2.8s ease-in-out infinite; }
.pip .p-head { transform-origin: 50px 52px; animation: p-tilt 8s ease-in-out infinite; }
.pip .p-wing-l { transform-origin: 33px 50px; animation: p-wingL 7s ease-in-out infinite; }
.pip .p-wing-r { transform-origin: 67px 50px; animation: p-wingR 7s ease-in-out infinite; }
.pip .p-beak-low { transform-origin: 50px 44px; }
.talking .pip .p-beak-low { animation: p-chat .2s infinite alternate; }
.talking .pip .p-head { animation: p-nod .5s ease-in-out infinite alternate; }
.pip.wave .p-wing-r { animation: p-wave 1.4s ease-in-out infinite; }
.pip.happy .p-body { animation: p-hop .8s cubic-bezier(.3,1.4,.5,1); }
.pip.happy .p-wing-l { animation: p-flapL .14s 6 alternate; }
.pip.happy .p-wing-r { animation: p-flapR .14s 6 alternate; }
@keyframes p-idle { 50% { transform: translateY(-1.6px) scaleY(.985); } }
@keyframes p-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
@keyframes p-crest { 50% { transform: rotate(6deg); } }
@keyframes p-tail { 50% { transform: rotate(-7deg); } }
@keyframes p-tilt { 0%, 38%, 100% { transform: rotate(0); } 46%, 58% { transform: rotate(-9deg); } 66%, 74% { transform: rotate(7deg); } 82% { transform: rotate(0); } }
@keyframes p-nod { to { transform: rotate(-4deg) translateY(1px); } }
@keyframes p-wingL { 0%, 82%, 100% { transform: rotate(0); } 85%, 91% { transform: rotate(32deg); } 88%, 94% { transform: rotate(4deg); } }
@keyframes p-wingR { 0%, 82%, 100% { transform: rotate(0); } 85%, 91% { transform: rotate(-32deg); } 88%, 94% { transform: rotate(-4deg); } }
@keyframes p-wave { 0%, 100% { transform: rotate(-70deg); } 50% { transform: rotate(-95deg); } }
@keyframes p-hop { 40% { transform: translateY(-14px) scale(1.04, .96); } 70% { transform: translateY(0) scale(1.06, .92); } }
@keyframes p-flapL { to { transform: rotate(40deg); } }
@keyframes p-flapR { to { transform: rotate(-40deg); } }
@keyframes p-chat { to { transform: translateY(2.6px) rotate(4deg); } }
/* Pip, more alive: real lip-sync, eyes that follow your finger, and little "acts" */
.pip .p-look { transition: transform .18s ease-out; }
.pip .p-feet { transform-origin: 50px 84px; }
.lipsync .talking .pip .p-beak-low { animation: none; transform: translateY(calc(var(--talk, 0) * 3.6px)) rotate(calc(var(--talk, 0) * 7deg)); }
.talking .pip .p-wing-r { animation: p-gesture 2.4s ease-in-out infinite; }
.talking .pip .p-crest { animation: p-crest 1s ease-in-out infinite; }
@keyframes p-gesture { 0%, 55%, 100% { transform: rotate(0); } 65%, 80% { transform: rotate(-38deg); } 72% { transform: rotate(-28deg); } }
.pip.act-dance .p-body { animation: p-dance .42s ease-in-out 6 alternate; }
.pip.act-dance .p-head { animation: p-headbob .21s ease-in-out 12 alternate; }
.pip.act-dance .p-wing-l { animation: p-flapSL .21s 12 alternate; }
.pip.act-dance .p-wing-r { animation: p-flapSR .21s 12 alternate; }
.pip.act-dance .p-tail { animation: p-tail .42s ease-in-out 6; }
@keyframes p-dance { from { transform: rotate(-8deg); } to { transform: rotate(8deg) translateY(-3px); } }
@keyframes p-headbob { to { transform: translateY(2px) rotate(4deg); } }
@keyframes p-flapSL { to { transform: rotate(22deg); } }
@keyframes p-flapSR { to { transform: rotate(-22deg); } }
.pip.act-look .p-head { animation: p-look 2.2s ease-in-out; }
@keyframes p-look { 20%, 42% { transform: rotate(-13deg) translateX(-2px); } 58%, 80% { transform: rotate(13deg) translateX(2px); } }
.pip.act-stretch .p-wing-l { animation: p-stretchL 1.8s ease-in-out; }
.pip.act-stretch .p-wing-r { animation: p-stretchR 1.8s ease-in-out; }
.pip.act-stretch .p-body { animation: p-tall 1.8s ease-in-out; }
.pip.act-stretch .p-eyes { animation: p-squint 1.8s ease-in-out; }
@keyframes p-stretchL { 25%, 70% { transform: rotate(78deg); } 50% { transform: rotate(68deg); } }
@keyframes p-stretchR { 25%, 70% { transform: rotate(-78deg); } 50% { transform: rotate(-68deg); } }
@keyframes p-tall { 25%, 70% { transform: scale(.97, 1.05); } }
@keyframes p-squint { 25%, 70% { transform: scaleY(.25); } }
.pip.act-hop .p-body { animation: p-hop .6s cubic-bezier(.3,1.4,.5,1) 2; }
.pip.act-hop .p-feet { animation: p-step .3s 4 alternate; }
@keyframes p-step { to { transform: scaleX(.8) translateY(-1px); } }
.pip.act-preen .p-head { animation: p-preen 2s ease-in-out; }
.pip.act-preen .p-wing-r { animation: p-preenW 2s ease-in-out; }
@keyframes p-preen { 25%, 75% { transform: rotate(32deg) translate(3px, 4px); } 40%, 60% { transform: rotate(26deg) translate(3px, 3px); } }
@keyframes p-preenW { 25%, 75% { transform: rotate(-24deg); } }
.pip.act-yawn .p-beak-low { animation: p-yawnB 2s ease-in-out; }
.pip.act-yawn .p-eyes { animation: p-yawnE 2s ease-in-out; }
.pip.act-yawn .p-head { animation: p-yawnH 2s ease-in-out; }
.pip.act-yawn .p-wing-l { animation: p-stretchL 2s ease-in-out; }
@keyframes p-yawnB { 20%, 70% { transform: translateY(6px) rotate(10deg) scaleY(1.3); } }
@keyframes p-yawnE { 20%, 70% { transform: scaleY(.12); } }
@keyframes p-yawnH { 20%, 70% { transform: rotate(-8deg) translateY(-1px); } }
.pip.act-sing .p-beak-low { animation: p-chat .3s ease-in-out 7 alternate; }
.pip.act-sing .p-head { animation: p-sway .6s ease-in-out 4 alternate; }
.pip.act-sing .p-eyes { animation: p-squint 2.4s ease-in-out; }
@keyframes p-sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
.pip.act-flip { animation: p-flip .9s cubic-bezier(.4,0,.3,1); }
.pip.act-flip .p-wing-l { animation: p-flapL .1s 8 alternate; }
.pip.act-flip .p-wing-r { animation: p-flapR .1s 8 alternate; }
@keyframes p-flip { 0% { transform: none; } 20% { transform: translateY(4%) scale(1.06, .9); } 60% { transform: translateY(-34%) rotate(300deg); } 85% { transform: translateY(0) rotate(360deg) scale(1.08, .9); } 100% { transform: rotate(360deg); } }
.pip.act-flutter { animation: p-flutter 1.6s ease-in-out; }
.pip.act-flutter .p-wing-l { animation: p-flapL .09s 16 alternate; }
.pip.act-flutter .p-wing-r { animation: p-flapR .09s 16 alternate; }
.pip.act-flutter .p-tail { animation: p-tail .3s 5; }
@keyframes p-flutter { 30% { transform: translate(-6%, -30%) rotate(-6deg); } 55% { transform: translate(6%, -36%) rotate(6deg); } 85% { transform: translate(0, 0) scale(1.08, .9); } 100% { transform: none; } }
.pip.flyin { animation: p-flyin 1.5s cubic-bezier(.25,.8,.35,1) both; }
.pip.flyin .p-wing-l { animation: p-flapL .1s 12 alternate; }
.pip.flyin .p-wing-r { animation: p-flapR .1s 12 alternate; }
@keyframes p-flyin { 0% { transform: translate(260%, -220%) rotate(-20deg) scale(.55); opacity: 0; } 12% { opacity: 1; } 55% { transform: translate(60%, -70%) rotate(-12deg) scale(.85); } 82% { transform: translate(0, -6%) rotate(4deg); } 91% { transform: scale(1.1, .88); } 100% { transform: none; } }
.pip.cheer .p-body { animation: p-hop .55s cubic-bezier(.3,1.4,.5,1) infinite; }
.pip.cheer .p-wing-l { animation: p-cheerL .275s ease-in-out infinite alternate; }
.pip.cheer .p-wing-r { animation: p-cheerR .275s ease-in-out infinite alternate; }
.pip.cheer .p-beak-low { transform: translateY(3px) rotate(6deg); }
@keyframes p-cheerL { from { transform: rotate(60deg); } to { transform: rotate(95deg); } }
@keyframes p-cheerR { from { transform: rotate(-60deg); } to { transform: rotate(-95deg); } }
.cel .celtop { display: flex; align-items: flex-end; gap: 4px; }
.cel svg.pip { width: 104px; height: 104px; animation: plop .6s cubic-bezier(.3,1.6,.5,1) both; }
.pip.happy .p-wing-l { animation: p-flapL .14s 6 alternate; }
.pip.happy .p-wing-r { animation: p-flapR .14s 6 alternate; }
.pipwrap { position: relative; flex: 0 0 auto; cursor: pointer; border: 0; background: none; padding: 0; }
.pipwrap .perch { position: absolute; left: -10%; right: -14%; bottom: 7%; height: 9%; min-height: 7px; border-radius: 99px; background: #9a6a3c; box-shadow: inset 0 -3px 0 #7b522c; }
.pipwrap .perch::after { content: "🍃"; position: absolute; right: -8%; top: -120%; font-size: 1.1em; transform: rotate(20deg); }
.pipwrap .pip { position: relative; z-index: 1; }
.note { position: absolute; font: 800 20px/1 var(--f-display); color: #8a4fd8; pointer-events: none; animation: notefloat 2.4s ease-out forwards; z-index: 2; }
@keyframes notefloat { 0% { opacity: 0; transform: translate(0, 0) rotate(-10deg); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(30px, -60px) rotate(15deg); } }
#shelf .pipwrap .pip { width: 96px; height: 96px; }
.bubble {
  position: relative; background: var(--card); border-radius: 18px; padding: 10px 14px; font-weight: 500; min-height: 44px;
  display: flex; align-items: center; box-shadow: 0 2px 0 var(--edge); min-width: 0;
}
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right-color: var(--card); border-left: 0; }

/* ---------- Welcome ---------- */
.restartnote { margin: 4px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
#splash { align-items: center; justify-content: center; text-align: center; gap: 14px;
  background: radial-gradient(circle at 50% 38%, #fff 0, var(--bg) 55%); border-radius: 28px; }
#splash h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 7vw, 60px); line-height: 1; margin: 0; text-wrap: balance; }
#splash h1 span { color: var(--accent); }
#splash p { margin: 0; color: var(--muted); max-width: 34ch; }
.go {
  font: 800 28px/1 var(--f-display); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
  padding: 20px 46px; cursor: pointer; box-shadow: 0 6px 0 #d45524; animation: breathe 1.6s infinite ease-in-out;
}
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #d45524; }
@keyframes breathe { 50% { transform: scale(1.05); } }

/* ---------- Shelf ---------- */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1; margin: 0; }
.logo span { color: var(--accent); }
.spacer { flex: 1 1 auto; }
.stars {
  display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 12px 6px 8px;
  font: 800 18px/1 var(--f-display); box-shadow: 0 2px 0 var(--edge); font-variant-numeric: tabular-nums;
}
.stars svg { width: 24px; height: 24px; }
.toggle {
  font: 500 13px/1 var(--f-body); background: var(--card); border: 2px solid var(--edge); border-radius: 999px;
  padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
}
.toggle .sw { width: 26px; height: 15px; border-radius: 99px; background: var(--edge); position: relative; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-pressed="true"] .sw { background: var(--accent); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(11px); }
.guide { display: flex; align-items: center; gap: 14px; }
.tiles {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 14px; padding: 4px 2px 8px;
  grid-template-columns: repeat(4, 1fr); align-content: start; width: 100%; max-width: 1100px; margin-inline: auto;
}
.tiles { padding-top: 16px; }
.tile {
  border: 0; border-radius: 26px; background: var(--card); cursor: pointer; padding: 14px 10px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 5px 0 var(--edge);
  transition: transform .12s;
}
.tile:hover { transform: translateY(-3px); }
.tile:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--edge); }
.tile .art {
  width: 100%; aspect-ratio: 1.7; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 2px;
  font-size: clamp(40px, 9vw, 58px); line-height: 1;
}
.tile .art.tight { font-size: clamp(30px, 7vw, 44px); }
.tile .name { font: 800 19px/1.1 var(--f-display); text-align: center; }

/* ---------- Game screen ---------- */
.gamebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.iconbtn {
  width: 52px; height: 52px; border-radius: 18px; border: 0; background: var(--card); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--edge); flex: 0 0 auto;
}
.iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.iconbtn svg { width: 28px; height: 28px; }
.gamebar .pip { width: 50px; height: 50px; }
.gamebar .bubble { flex: 1 1 160px; font-size: 15px; }
.gamebar .bubble:empty { visibility: hidden; }
@media (max-width: 620px) { .gamebar .bubble:empty { display: none; } }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font: 600 13px/1 var(--f-body); background: var(--card); border: 2px solid var(--edge); border-radius: 999px;
  padding: 7px 11px; cursor: pointer;
}
.chip[aria-checked="true"] { background: var(--sel); border-color: var(--sel); color: #fff; }
.groot { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 26px; background: var(--bg2); overflow: hidden; }

/* progress dots */
.dots { display: inline-flex; gap: 5px; padding: 0 4px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--edge); }
.dots i.on { background: var(--sun); box-shadow: inset 0 0 0 2px #e0a300; }

/* ---------- Memory ---------- */
.mem { position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; padding: 12px; }
.card { perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; }
.card .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.card.open .in, .card.done .in { transform: rotateY(180deg); }
.card .face, .card .back {
  position: absolute; inset: 0; border-radius: 18px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.card .back {
  background: var(--t2);
  background-image: radial-gradient(rgba(255,255,255,.28) 2px, transparent 2.5px); background-size: 16px 16px;
  box-shadow: 0 4px 0 #2f8ed6, inset 0 0 0 5px rgba(255,255,255,.55);
}
.card .back svg { width: 42%; height: 42%; }
.card .face { background: var(--card); transform: rotateY(180deg); box-shadow: 0 4px 0 var(--edge); }
.card .emo { font-size: var(--emo, 48px); line-height: 1; }
.card .word { font: 700 var(--wd, 18px)/1 var(--f-letter); }
.card .blob { width: var(--blob, 40px); height: var(--blob, 40px); border-radius: 46% 54% 50% 50% / 52% 44% 56% 48%; box-shadow: inset -4px -4px 0 rgba(0,0,0,.12); }
.card.done .face { box-shadow: 0 4px 0 #2e9d55, inset 0 0 0 4px var(--good); animation: glow .6s; }
@keyframes glow { 40% { transform: rotateY(180deg) scale(1.08); } }

/* ---------- Tic tac toe ---------- */
.ttt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
.board3 { position: relative; width: var(--bs, 300px); height: var(--bs, 300px); border-radius: 14px;
  background: #fffdf5 repeating-linear-gradient(0deg, transparent 0 calc(var(--bs, 300px) / 12 - 1px), rgba(120,160,200,.13) calc(var(--bs, 300px) / 12 - 1px) calc(var(--bs, 300px) / 12));
  box-shadow: 0 2px 0 #e7dfc8, 0 10px 24px rgba(60,50,30,.16); }
.board3 .cells { position: absolute; inset: 4%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.cell3 { border: 0; background: transparent; cursor: pointer; border-radius: 10px; -webkit-tap-highlight-color: transparent; }
.cell3:not(:disabled):hover { background: rgba(255,214,90,.16); }
.cell3:focus-visible { outline: 3px solid var(--accent); outline-offset: -6px; }
.cell3.win { background: rgba(255,214,90,.28); }
.board3 svg.ink { position: absolute; inset: 4%; width: 92%; height: 92%; pointer-events: none; overflow: visible; }
.ink path, .ink circle { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ink .grid path { stroke: #34323d; stroke-width: 6.5; }
.ink .mx { stroke: #e2412f; stroke-width: 12; }
.ink .mo { stroke: #2a73d4; stroke-width: 12; }
.ink .strike { stroke: #2f2d38; stroke-width: 8; opacity: .85; }
.ink .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ink .22s ease-out forwards; }
.ink .draw.d2 { animation-delay: .17s; }
.ink .grid .draw { animation-duration: .35s; }
.ink .strike.draw { animation-duration: .45s; }
@keyframes plop { from { transform: scale(0); } }
@keyframes ink { to { stroke-dashoffset: 0; } }
.ink .wonmark { animation: wob .5s ease-in-out .3s 2; transform-box: fill-box; transform-origin: center; }
@keyframes wob { 50% { transform: scale(1.15) rotate(-6deg); } }
.turn .who svg { width: 22px; height: 22px; }
.turn .who b:empty { display: none; }
.turn { display: flex; gap: 10px; align-items: center; font: 800 20px/1 var(--f-display); }
.turn .who { padding: 8px 14px; border-radius: 999px; background: var(--card); opacity: .5; display: inline-flex; gap: 6px; align-items: center; }
.turn .who.on { opacity: 1; box-shadow: 0 0 0 3px var(--accent); }
.big-btn {
  font: 800 20px/1 var(--f-display); background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 14px 26px;
  cursor: pointer; box-shadow: 0 5px 0 #d45524;
}
.big-btn.alt { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--edge); }
.big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d45524; }

/* ---------- Tracing ---------- */
.trace { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 12px; }
.trace .pad { position: relative; background: var(--card); border-radius: 26px; box-shadow: 0 5px 0 var(--edge); touch-action: none; }
.trace canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; }
.trace .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.trace .sticker { font-size: 64px; line-height: 1; min-height: 70px; }
.trace .start {
  position: absolute; border-radius: 50%; background: #3fbf6a; color: #fff; font: 800 18px/1 var(--f-display);
  display: flex; align-items: center; justify-content: center; pointer-events: none; box-shadow: 0 0 0 4px rgba(63,191,106,.3);
  animation: beacon 1.2s infinite ease-in-out;
}
@keyframes beacon { 50% { box-shadow: 0 0 0 12px rgba(63,191,106,0); transform: scale(1.08); } }
.trace .sticker.show { animation: plop .5s cubic-bezier(.3,1.6,.5,1); }
.trace .word { font: 700 26px/1 var(--f-letter); }
.trace .word b { color: var(--accent); }
.navrow { display: flex; gap: 10px; }

/* ---------- Counting ---------- */
.count { position: absolute; inset: 0; }
.thing {
  position: absolute; border: 0; background: none; padding: 0; cursor: pointer; line-height: 1; transform: translate(-50%, -50%);
}
.thing .e { display: block; transition: transform .2s; }
.thing.got .e { animation: hop .35s; }
@keyframes hop { 50% { transform: translateY(-14px) scale(1.12); } }
.thing .n {
  position: absolute; right: -8px; top: -8px; background: var(--accent); color: #fff; border-radius: 999px;
  font: 800 18px/30px var(--f-display); min-width: 30px; height: 30px; padding: 0 6px; text-align: center; animation: plop .25s;
}
.choices { position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; gap: 14px; }
.choice {
  width: 84px; height: 84px; border-radius: 24px; border: 0; background: var(--card); box-shadow: 0 5px 0 var(--edge);
  font: 800 44px/1 var(--f-display); cursor: pointer; animation: plop .3s cubic-bezier(.3,1.6,.5,1);
}
.choice.no { animation: shake .4s; }
.choice.yes { background: var(--good); color: #fff; box-shadow: 0 5px 0 #2e9d55; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* ---------- Add & take away ---------- */
.math { position: absolute; inset: 0; }
.math .eq {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--card); border-radius: 22px; padding: 6px 26px;
  font: 700 46px/1.15 var(--f-letter); box-shadow: 0 4px 0 var(--edge); white-space: nowrap; min-width: 120px; text-align: center; z-index: 6;
}
.math .eq b { color: var(--accent); }
.math .plus { position: absolute; transform: translate(-50%, -50%); font: 800 72px/1 var(--f-display); color: var(--accent); z-index: 4; text-shadow: 0 3px 0 #fff; }
.math .thing { position: absolute; transform: none; display: flex; align-items: center; justify-content: center; z-index: 3; }
.math .thing .e { font-size: var(--sz); line-height: 1; }
.math .thing .n { right: -4px; top: -4px; }
.math .thing.new::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; background: rgba(255,214,90,.55); z-index: -1; }
.math .thing.pop .e { animation: plop .45s cubic-bezier(.3,1.6,.5,1); }
.math .thing.swim .e { animation: swim 1.1s cubic-bezier(.25,.9,.4,1); }
.math .thing.drop .e { animation: drop 1s cubic-bezier(.3,.9,.5,1); }
.math .thing.gone .e { opacity: .2; filter: grayscale(1); }
.math .thing.gone::after { content: ""; position: absolute; inset: 6%; border: 3px dashed rgba(34,50,74,.35); border-radius: 50%; }
.math .thing.dance .e { animation: dance .6s ease-in-out 2; }
.math .flyer { position: absolute; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
.math .flyer .e { font-size: var(--sz); line-height: 1; display: block; }
.math .flyer.hop .e { animation: hopaway 1.4s ease-in forwards; }
.math .flyer.eat .e { animation: eaten 1.2s ease-in forwards; }
.math .flyer.burst .e { animation: bubburst .5s ease-out forwards; }
.math .bub { width: var(--sz); height: var(--sz); border-radius: 50%; display: block;
  background: radial-gradient(circle at 32% 30%, #fff 0 12%, rgba(255,255,255,.2) 13% 45%, rgba(120,200,255,.35) 70%, rgba(180,120,255,.45) 100%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.8), 0 2px 6px rgba(60,120,200,.25); }
.math .delta { position: absolute; transform: translate(-50%, -50%); font: 800 30px/1 var(--f-display); color: var(--accent); z-index: 7; pointer-events: none;
  text-shadow: 0 2px 0 #fff; animation: rise1 1.4s ease-out forwards; }
.math .burst { z-index: 6; }
@keyframes swim { 0% { transform: translateX(340px); } 50% { transform: translateX(60px) translateY(-6px); } 75% { transform: translateX(-8px) translateY(4px); } 100% { transform: none; } }
@keyframes drop { 0% { transform: translateY(-460px); } 65% { transform: translateY(8px); } 82% { transform: translateY(-14px); } 100% { transform: none; } }
@keyframes hopaway { 30% { transform: translate(40px, -110px) rotate(-10deg); } 75% { transform: translate(160px, 60px) scale(.7); opacity: 1; } 100% { transform: translate(190px, 140px) scale(.3); opacity: 0; } }
@keyframes eaten { 25% { transform: scale(1.12) rotate(-8deg); } 50% { transform: scale(.75) rotate(8deg); clip-path: circle(42% at 40% 50%); } 75% { transform: scale(.45); clip-path: circle(30% at 30% 55%); } 100% { transform: scale(0); opacity: 0; } }
@keyframes bubburst { 60% { transform: scale(1.3); } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes dance { 25% { transform: translateY(-14px) rotate(-8deg); } 75% { transform: translateY(-6px) rotate(8deg); } }
@keyframes rise1 { 0% { opacity: 0; transform: translate(-50%, 0) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%); } }
/* scenes */
.math .scene { position: absolute; border-radius: 22px; overflow: hidden; }
.math .scene .bg { position: absolute; }
.math .scene .deco { position: absolute; font-size: 44px; line-height: 1; opacity: .9; }
.math .scene .d0 { left: 3%; bottom: 4%; } .math .scene .d1 { right: 4%; top: 5%; } .math .scene .d2 { right: 6%; bottom: 4%; }
.scene.pond { background: #a9dc8e; }
.scene.pond .bg { inset: 7% 4%; border-radius: 50%; background: radial-gradient(ellipse at 50% 45%, #9fdcf7 0 40%, #6cc3ec 75%); box-shadow: inset 0 0 0 7px #58b2de; }
.scene.basket { background: linear-gradient(#cdeeff 0 55%, #a9dc8e 55%); }
.scene.basket .bg { left: 5%; right: 5%; top: 18%; bottom: 5%; border-radius: 14px 14px 40% 40% / 14px 14px 30% 30%;
  background: repeating-linear-gradient(45deg, #d39a5c 0 12px, #c4874a 12px 24px); box-shadow: inset 0 10px 0 #b0773e, 0 4px 0 #9a6430; }
.scene.basket .d0 { left: 1%; top: 1%; bottom: auto; font-size: 64px; }
.scene.plate { background: repeating-conic-gradient(#ffd6d6 0 25%, #fff 0 50%) 0 0 / 48px 48px; }
.scene.plate .bg { inset: 6% 4%; border-radius: 50%; background: radial-gradient(ellipse, #fff 0 62%, #eef3f7 63% 72%, #fff 73%); box-shadow: 0 6px 0 #d7e1e8; }
.scene.log { background: linear-gradient(#cdeeff 0 30%, #7cc8ee 30%); }
.scene.log .bg { left: 4%; right: 4%; top: 14%; bottom: 14%; border-radius: 60px;
  background: repeating-linear-gradient(0deg, #a8723f 0 10px, #9a6636 10px 13px); box-shadow: inset 0 -10px 0 #7d5129, 0 6px 0 #5f9fc4; }
.scene.party { background: #fde7f1; }
.scene.party .bg { left: 0; right: 0; bottom: 0; top: 22%; background: repeating-linear-gradient(90deg, #ff9ec8 0 28px, #ffc4dd 28px 56px); }
.scene.party .d1 { top: 2%; } .scene.party .d0 { top: 2%; bottom: auto; }
.scene.sky { background: linear-gradient(#8fd3ff, #d8f1ff); }
.scene.sky .d0 { top: 8%; bottom: auto; font-size: 56px; } .scene.sky .d1 { top: 30%; font-size: 48px; }

/* ---------- Think It Through ---------- */
.lq { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; gap: 10px; padding: 12px; container-type: size; }
.kw { display: inline-block; padding: 0 9px; border-radius: 9px; color: #fff; font: 800 .95em/1.4 var(--f-display); letter-spacing: .03em; }
.kw-and { background: #2e9d55; } .kw-or { background: #1e78d6; } .kw-not { background: #e0453a; } .kw-qty { background: #8a4fd8; } .kw-if { background: #ef7a2f; }
.swatch-dot { display: inline-block; width: 1.3em; height: 1.3em; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); vertical-align: middle; }
.swatch-dot.big { width: 34px; height: 34px; }
.nope { animation: shake .4s !important; }
/* detective */
.cluebar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; min-height: 58px; }
.clue { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 18px; padding: 8px 14px; box-shadow: 0 4px 0 var(--edge); animation: plop .4s cubic-bezier(.3,1.6,.5,1); font-size: 22px; }
.clue svg { width: 40px; height: 34px; }
.cluebar.done .clue { box-shadow: 0 4px 0 #2e9d55, inset 0 0 0 3px var(--good); }
.monsters { display: grid; grid-template-columns: repeat(3, min(26cqw, 30cqh)); gap: min(3cqw, 18px); }
.monster { width: 100%; aspect-ratio: 1; border: 0; background: var(--card); border-radius: 26px; box-shadow: 0 5px 0 var(--edge); padding: 8%; cursor: pointer; transition: transform .2s; }
.monster svg { width: 100%; height: 100%; animation: monidle 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.monster:nth-child(2n) svg { animation-delay: -1.3s; }
.monster.bye { animation: byebye .6s ease-in forwards; pointer-events: none; }
.monster.kept { box-shadow: 0 5px 0 #2e9d55, inset 0 0 0 5px var(--good); background: #eafaf0; position: relative; }
.monster.kept::after { content: "✓"; position: absolute; right: -6px; top: -6px; width: 32px; height: 32px; border-radius: 50%; background: var(--good); color: #fff; font: 800 19px/32px var(--f-display); text-align: center; animation: plop .25s; }
.monster.kept svg { animation: dance .5s ease-in-out 1; }
.clue.old { opacity: .55; transform: scale(.9); }
.monster.found { box-shadow: 0 5px 0 #e0a300, inset 0 0 0 5px var(--sun); background: #fff8dc; }
.monster.found svg { animation: dance .5s ease-in-out infinite; }
@keyframes monidle { 50% { transform: scale(1.03, .97); } }
@keyframes byebye { 30% { transform: translateY(-14px) rotate(-8deg); } 100% { transform: translateY(30px) scale(.2); opacity: 0; } }
/* machine */
.rules { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.rule { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 18px; padding: 6px 12px; box-shadow: 0 4px 0 var(--edge); font-size: 18px; }
.rule .ri { font-size: min(9cqmin, 44px); line-height: 1; }
.rule .arrow { color: var(--muted); font-size: 22px; }
.rule.glow { animation: rglow 1.4s; }
@keyframes rglow { 0%, 60% { box-shadow: 0 4px 0 #e0a300, 0 0 0 5px var(--sun); transform: scale(1.06); } }
.machrow { display: flex; align-items: center; gap: min(4cqw, 24px); }
.inbox, .outbox { font-size: min(14cqmin, 72px); line-height: 1; width: 1.4em; height: 1.4em; display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: 22px; box-shadow: 0 4px 0 var(--edge); }
.outbox { color: var(--muted); font: 800 min(12cqmin, 60px)/1 var(--f-display); }
.outbox.pop { font-size: min(14cqmin, 72px); animation: plop .5s cubic-bezier(.3,1.6,.5,1); }
.outbox.win { box-shadow: 0 4px 0 #2e9d55, inset 0 0 0 4px var(--good); }
.inbox.drop { animation: dropin .9s ease-in forwards; }
@keyframes dropin { 40% { transform: translateY(-20px); } 100% { transform: translateX(min(20cqw, 140px)) scale(.2); opacity: 0; } }
.mach { position: relative; width: min(34cqw, 230px); height: min(24cqh, 160px); border-radius: 26px; background: linear-gradient(#a58cff, #7a5ce0); box-shadow: 0 6px 0 #5a3fc0, inset 0 -10px 0 rgba(0,0,0,.08); }
.mach .gear { position: absolute; font-size: min(8cqmin, 42px); line-height: 1; animation: spin 4s linear infinite; }
.mach .g1 { left: 10%; top: 12%; } .mach .g2 { right: 10%; bottom: 12%; animation-direction: reverse; }
.mach.run .gear { animation-duration: .5s; }
.mach .lt { position: absolute; top: 10%; width: 10px; height: 10px; border-radius: 50%; background: #ffd23f; animation: blink 1.2s infinite; }
.mach .l1 { left: 44%; } .mach .l2 { left: 52%; background: #ff6b6b; animation-delay: .3s; } .mach .l3 { left: 60%; background: #6bf0a0; animation-delay: .6s; }
.mach.run .lt { animation-duration: .25s; }
.mach .mlabel { position: absolute; left: 0; right: 0; bottom: 14%; text-align: center; color: #fff; font: 800 min(4cqmin, 18px)/1.05 var(--f-display); }
.mach.run { animation: rumble .15s infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .3; } }
@keyframes rumble { 50% { transform: translate(1px, -1px); } }
.mchoices { display: flex; gap: 14px; }
.mchoice { font-size: min(11cqmin, 54px); line-height: 1; width: 1.6em; height: 1.6em; border: 0; border-radius: 22px; background: var(--card); box-shadow: 0 5px 0 var(--edge); cursor: pointer; }
.mchoice.picked { box-shadow: 0 5px 0 #2e9d55, inset 0 0 0 4px var(--good); }
/* sorting */
.srule { display: inline-flex; align-items: center; gap: 12px; background: var(--card); border-radius: 22px; padding: 8px 18px; box-shadow: 0 4px 0 var(--edge); font-size: 26px; }
.srule .swatch-dot { width: 46px; height: 46px; }
.sruleWrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.srule .cond { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.srule .mark { width: 30px; height: 30px; border-radius: 8px; border: 3px dashed var(--edge); font: 800 20px/24px var(--f-display); text-align: center; font-style: normal; }
.srule .mark.y { border: 3px solid var(--good); background: var(--good); color: #fff; animation: plop .25s; }
.srule .mark.n { border: 3px solid #e0453a; background: #e0453a; color: #fff; animation: plop .25s; }
.need { font: 700 17px/1 var(--f-body); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.need b { color: var(--ink); }
.need i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; background: var(--good); color: #fff; font: 800 14px/22px var(--f-display); text-align: center; }
.need.and b { color: #2e9d55; } .need.or b { color: #1e78d6; }
.sshape svg { width: 48px; height: 48px; display: block; }
.belt { position: relative; width: min(92cqw, 640px); height: min(30cqh, 150px); }
.belt .stripes { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; border-radius: 14px; background: repeating-linear-gradient(90deg, #5b6b7d 0 22px, #74859a 22px 44px); animation: belt 1s linear infinite; box-shadow: 0 5px 0 #3e4b5a; }
@keyframes belt { to { background-position: 44px 0; } }
.onbelt { position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center; }
.sitem { width: min(24cqh, 120px); height: min(24cqh, 120px); display: block; animation: ride .55s cubic-bezier(.2,.9,.4,1); }
.sitem svg { width: 100%; height: 100%; }
.sitem.toyes { animation: toyes .45s ease-in forwards; } .sitem.tono { animation: tono .45s ease-in forwards; }
@keyframes ride { from { transform: translateX(-60cqw); } }
@keyframes toyes { to { transform: translate(-22cqw, 30cqh) scale(.3); opacity: 0; } }
@keyframes tono { to { transform: translate(22cqw, 30cqh) scale(.3); opacity: 0; } }
.baskets { display: flex; gap: min(14cqw, 90px); }
.basket { width: min(30cqw, 170px); height: min(20cqh, 110px); border: 0; border-radius: 18px 18px 46px 46px; cursor: pointer; color: #fff; font: 800 34px/1 var(--f-display); display: flex; align-items: center; justify-content: center; gap: 12px; }
.basket.yes { background: repeating-linear-gradient(45deg, #3fbf6a 0 14px, #36a95d 14px 28px); box-shadow: 0 6px 0 #2e9d55; }
.basket.no { background: repeating-linear-gradient(45deg, #f0675c 0 14px, #dc5a50 14px 28px); box-shadow: 0 6px 0 #c94a40; }
.basket .cnt { font-size: 22px; background: rgba(255,255,255,.3); border-radius: 99px; min-width: 34px; padding: 4px 8px; }
.basket.bump { animation: plop .3s; }
/* make it true */
.goalb { width: 38px; height: 46px; border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; display: inline-block; box-shadow: inset -6px -7px 0 rgba(0,0,0,.12); }
.mitrow { display: flex; gap: min(3cqw, 20px); align-items: flex-end; }
.mitb { --bc: #f44336; width: min(15cqw, 26cqh, 110px); aspect-ratio: .85; border: 0; padding: 0; cursor: pointer; background: var(--bc); position: relative;
  border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%; box-shadow: inset -10px -12px 0 rgba(0,0,0,.12), inset 8px 8px 0 rgba(255,255,255,.25); transition: background .25s; animation: bob 2.4s ease-in-out infinite; }
.mitb:nth-child(2n) { animation-delay: -1.2s; }
.mitb::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 40%; background: rgba(34,50,74,.35); }
.mitb.flip { animation: plop .3s; }
.mitb.yay { animation: rise2 1s ease-in-out infinite alternate; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes rise2 { to { transform: translateY(-22px); } }
.checkbtn { width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--good); color: #fff; font: 800 40px/1 var(--f-display); box-shadow: 0 6px 0 #2e9d55; cursor: pointer; margin-top: 30px; }
.checkbtn:disabled { opacity: .6; }

/* ---------- Story Time ---------- */
.story { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.books { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-content: start; max-width: 1080px; width: 100%; margin: 0 auto; padding: 4px 4px 12px; }
.bookcard { border: 0; background: var(--card); border-radius: 22px; padding: 10px 10px 14px; box-shadow: 0 6px 0 var(--edge); cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform .15s; }
.bookcard:hover { transform: translateY(-3px) rotate(-1deg); }
.bookcard .sart { aspect-ratio: 4 / 3; border-radius: 16px; }
.btitle { font: 800 20px/1.15 var(--f-display); text-align: center; text-wrap: balance; }
.titlepage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.titlepage .sart { width: min(560px, 90%); aspect-ratio: 4 / 3; border-radius: 22px; box-shadow: 0 6px 0 var(--edge); }
.titlepage h2 { font: 800 clamp(28px, 4.5vw, 44px)/1.05 var(--f-display); margin: 0; text-align: center; text-wrap: balance; }
.titlepage .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.spage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.spage.flipin { animation: pageturn .45s cubic-bezier(.3,1.1,.5,1); }
@keyframes pageturn { from { opacity: 0; transform: translateX(40px) rotate(1deg); } }
.spage .sart { flex: 1 1 auto; min-height: 140px; border-radius: 22px; box-shadow: 0 5px 0 var(--edge); }
.sart { position: relative; overflow: hidden; container-type: size; }
.sart .sbg { position: absolute; inset: 0; }
.actor { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--sz) * 1cqh); line-height: 1; }
.actor .pip { width: calc(var(--sz) * 1.1cqh); height: calc(var(--sz) * 1.1cqh); display: block; }
.actor .ill { width: calc(var(--sz) * 1.12cqh); height: calc(var(--sz) * 1.12cqh); display: block; overflow: visible; }
.ill .ill-ink { stroke: #3a3340; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.sbg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sbg .rain { animation: rainfall .8s linear infinite; } .sbg .rain.r1 { animation-delay: .27s; } .sbg .rain.r2 { animation-delay: .53s; }
@keyframes rainfall { from { transform: translate(0, -8px); opacity: 0; } 30% { opacity: 1; } to { transform: translate(-3px, 10px); opacity: 0; } }
.qc .qe .ill { width: 1em; height: 1em; display: block; }
.a-bob { animation: a-bob 2.4s ease-in-out infinite; } .a-hop { animation: a-hop 1.6s ease-in-out infinite; } .a-sway { animation: a-sway 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.a-spin { animation: a-spin 14s linear infinite; } .a-pulse { animation: a-pulse 1.8s ease-in-out infinite; } .a-shake { animation: a-shake 1.4s ease-in-out infinite; }
.a-crawl { animation: a-crawl 5s ease-in-out infinite alternate; } .a-fly { animation: a-fly 3.2s ease-in-out infinite; } .a-swim { animation: a-swim 3s ease-in-out infinite; }
.a-droop { animation: a-droop 3s ease-in-out infinite; } .a-fall { animation: a-fall 5s linear infinite; } .a-fall2 { animation: a-fall 6.5s linear infinite -2s; }
@keyframes a-bob { 50% { transform: translate(-50%, -56%); } }
@keyframes a-hop { 0%, 60%, 100% { transform: translate(-50%, -50%); } 30% { transform: translate(-50%, -72%); } }
@keyframes a-sway { 50% { transform: translate(-50%, -50%) rotate(6deg); } }
