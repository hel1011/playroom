TH!", "lq_sort_or_yellow_circle": "Anything yellow, OR any circle, goes in the yes basket. EITHER one is fine!", "lq_sort_and_yellow_square": "Only shapes that are yellow, AND also a square, go in the yes basket. It has to be BOTH!", "lq_sort_or_yellow_square": "Anything yellow, OR any square, goes in the yes basket. EITHER one is fine!", "lq_sort_and_yellow_star": "Only shapes that are yellow, AND also a star, go in the yes basket. It has to be BOTH!", "lq_sort_or_yellow_star": "Anything yellow, OR any star, goes in the yes basket. EITHER one is fine!", "lq_sort_and_yellow_heart": "Only shapes that are yellow, AND also a heart, go in the yes basket. It has to be BOTH!", "lq_sort_or_yellow_heart": "Anything yellow, OR any heart, goes in the yes basket. EITHER one is fine!", "lq_det_is_green": "The monster is green! Tap every green monster.", "lq_det_not_green": "The monster is NOT green. Tap every monster that is NOT green.", "lq_mit_all_green": "Can you make ALL of the balloons green?", "lq_mit_some_green": "Can you make SOME of the balloons green, but NOT ALL of them?", "lq_mit_none_green": "Can you make NONE of the balloons green? Not even one!", "lq_sort_and_green_circle": "Only shapes that are green, AND also a circle, go in the yes basket. It has to be BOTH!", "lq_sort_or_green_circle": "Anything green, OR any circle, goes in the yes basket. EITHER one is fine!", "lq_sort_and_green_square": "Only shapes that are green, AND also a square, go in the yes basket. It has to be BOTH!", "lq_sort_or_green_square": "Anything green, OR any square, goes in the yes basket. EITHER one is fine!", "lq_sort_and_green_star": "Only shapes that are green, AND also a star, go in the yes basket. It has to be BOTH!", "lq_sort_or_green_star": "Anything green, OR any star, goes in the yes basket. EITHER one is fine!", "lq_sort_and_green_heart": "Only shapes that are green, AND also a heart, go in the yes basket. It has to be BOTH!", "lq_sort_or_green_heart": "Anything green, OR any heart, goes in the yes basket. EITHER one is fine!", "lq_det_more": "Great job! Those ones stay. Now here's another clue.", "lq_det_hint": "Hmm, does that one match the clue? Take another look!", "lq_det_found": "You found the hiding monster! Wow, you're a super detective!", "lq_mach_intro": "This is my magic machine! It always follows the rules. IF this goes in, THEN that comes out.", "lq_mach_q": "Something is going in! What do you think will come out?", "lq_mach_chain": "Ooh, two rules work together this time! What comes out at the very end?", "lq_mach_ok": "Yes! You followed the rule. That's exactly what comes out!", "lq_mach_no": "Hmm, not that one. Find the rule that starts with this thing.", "lq_sort_intro": "It's sorting time! Look at the rule, then put each shape in the yes basket, or the no basket.", "lq_sort_and_hint": "Not quite! With AND, it has to be BOTH things at once.", "lq_sort_or_hint": "Not quite! With OR, just one of them is enough.", "lq_sort_done": "All sorted! Wow, you're a really good sorter!", "lq_mit_intro": "Tap a balloon to change its color. When it looks right, press the big check!", "lq_mit_ok_all": "Woo-hoo! EVERY single balloon!", "lq_mit_ok_some": "Yes! SOME of them, but NOT ALL. Perfect!", "lq_mit_ok_none": "Yes! Not even one. NONE at all!", "lq_mit_no": "Hmm, not quite yet. Take another look!", "bk_end": "The end! Yay! You're a wonderful reader!", "benny_title": "Benny and the Missing Carrot.", "benny_0": "This is Benny. Benny is a little bunny with big, floppy ears.", "benny_1": "Benny loves carrots more than anything. Every morning, he eats one crunchy, orange carrot.", "benny_2": "One morning, Benny looked in his basket. Oh no! His carrot was gone!", "benny_3": "What does Benny love to eat? Is it pizza, carrots, or bananas?", "benny_3_yes": "Yes! Benny loves crunchy carrots.", "benny_4": "Benny hopped to the pond. \"Duck, have you seen my carrot?\" Duck shook her head. \"No, but I saw something orange by the big tree.\"", "benny_5": "So Benny hopped to the big tree. Up in the branches sat Squirrel, holding something orange.", "benny_6": "Who did Benny ask first? Squirrel, Duck, or Bear?", "benny_6_yes": "That's right! Benny asked Duck at the pond first.", "benny_7": "But it was not a carrot. It was a shiny orange leaf! \"Sorry, Benny,\" said Squirrel. \"It's autumn, and the leaves are orange too.\"", "benny_8": "What was Squirrel holding? A leaf, a carrot, or a nut?", "benny_8_yes": "Yes! It was an orange leaf, not a carrot.", "benny_9": "Benny felt sad. He hopped home slowly. Then he saw his little sister, Bella, in the garden.", "benny_10": "Bella was planting the carrot in the dirt! \"Now we will have lots and lots of carrots,\" she said.", "benny_11": "Benny smiled a big bunny smile. \"Sharing is even better than crunching,\" he said. And they waited for the carrots to grow.", "benny_12": "Where was the missing carrot? In the tree, in the pond, or in the garden?", "benny_12_yes": "Yes! Bella planted it in the garden.", "benny_13": "How did Benny feel at the end of the story? Sad, happy, or angry?", "benny_13_yes": "Yes! Benny was happy, because sharing made him smile.", "benny_14": "Why do you think Bella planted the carrot? Because she didn't like carrots, to hide it from Benny, or so they could grow lots more carrots?", "benny_14_yes": "Yes! Bella planted one carrot, so they could grow lots and lots of carrots to share.", "benny_15": "What do you think this story teaches us? That sharing can make things even better, that you should always run fast, or that you should never ask for help?", "benny_15_yes": "Yes! One carrot, shared, became lots of carrots. Sharing can be even better than keeping something all to yourself.", "pip_title": "Pip's Rainy Day.", "pip_0": "Pip the parrot woke up and looked out the window. Drip, drop, drip! It was raining.", "pip_1": "\"Oh no,\" said Pip. \"I wanted to play at the park today!\"", "pip_2": "What was the weather like when Pip woke up? Sunny, snowy, or rainy?", "pip_2_yes": "Yes! It was a rainy day. Drip, drop, drip!", "pip_3": "Then Pip had an idea! Pip built a cozy fort with blankets and pillows.", "pip_4": "Inside the fort, Pip read a book about the ocean, with whales, and crabs, and shiny fish.", "pip_5": "What did Pip build inside? A blanket fort, a sandcastle, or a snowman?", "pip_5_yes": "That's right! Pip built a cozy blanket fort.", "pip_6": "Next, Pip painted a picture of the sea, using red, yellow, and blue.", "pip_7": "Then the rain stopped. Pip looked out the window, and saw a big, bright rainbow!", "pip_8": "What did Pip see when the rain stopped? The moon, a rainbow, or an airplane?", "pip_8_yes": "Yes! A big, bright rainbow!", "pip_9": "Pip flew to the park, and splashed in a big puddle. Splish, splash! A rainy day can be a fun day, after all.", "pip_10": "What did Pip do right after building the fort? Paint a picture, read a book, or splash in a puddle?", "pip_10_yes": "Yes! First Pip built the fort, and then Pip read a book about the ocean.", "pip_11": "How did Pip feel when it started to rain? Sad, because Pip couldn't go to the park? Happy, because Pip loves rain? Or mad at a friend?", "pip_11_yes": "Yes! Pip felt sad, because Pip really wanted to play at the park. When plans change, it's okay to feel disappointed.", "pip_12": "What did Pip find out on the rainy day? That rain is always bad, that parks are boring, or that you can still have fun when plans change?", "pip_12_yes": "That's right! Pip built a fort, read a book, and painted a picture. Even when plans change, you can find something fun to do.", "sami_title": "Sami and Tall Hill.", "sami_0": "Sami the snail was very small, and very slow. She carried her house on her back, everywhere she went.", "sami_1": "Sami wanted to see the sunset from the top of Tall Hill. But the hill was so big, and Sami was so small!", "sami_2": "What did Sami carry on her back? Her house, a backpack, or an apple?", "sami_2_yes": "Yes! A snail carries its shell, like a little house.", "sami_3": "Along came Ladybug. \"I can help!\" said Ladybug, and she showed Sami a shortcut through the flowers.", "sami_4": "Next, they met Ant, who was pulling a big leaf like a wagon. \"Climb on!\" said Ant.", "sami_5": "Who helped Sami first? Ant, Ladybug, or Butterfly?", "sami_5_yes": "That's right! Ladybug helped first, and then Ant.", "sami_6": "Ant pulled and pulled. Ladybug pushed and pushed. Up, up, up they went!", "sami_7": "At last, they reached the top of Tall Hill, just as the sky turned pink and orange.", "sami_8": "Where did the friends go together? To the beach, to the top of the hill, or to school?", "sami_8_yes": "Yes! They climbed all the way to the top of Tall Hill.", "sami_9": "\"Thank you, friends,\" said Sami. \"Being small is okay, when you have big friends to help.\" And they watched the sun go down, together.", "sami_10": "What is this story mostly about? Friends helping each other, running a fast race, or eating a big lunch?", "sami_10_yes": "Yes! It's a story about friends helping each other.", "sami_11": "Why did Sami need help to climb Tall Hill? Because she was sleepy, because it was raining, or because she was small and slow?", "sami_11_yes": "Yes! The hill was so big, and Sami was so small and slow. Climbing it all alone would have been very hard.", "sami_12": "Sami said, being small is okay, when you have big friends to help. What do you think she meant? That small animals should stay home, that friends make hard things easier, or that big animals are scary?", "sami_12_yes": "Yes! Ladybug and Ant were small too, but they had big, kind hearts. When we help each other, hard things get easier.", "max_title": "Max Meets the Moon.", "max_0": "Max was a little puppy who loved evening walks with his mom.", "max_1": "One night, Max saw a big, round, glowing moon in the sky.", "max_2": "What did Max see in the sky? The sun, a rainbow, or the moon?", "max_2_yes": "Yes! Max saw a big, round moon.", "max_3": "Max walked to the corner. He looked up. The moon was still there!", "max_4": "Max ran all the way to the park. He looked up again. The moon was there too! \"Mom, the moon is following me!\" said Max.", "max_5": "Why did Max think the moon was following him? Was it because the moon was everywhere he went, because the moon had little feet, or because the moon wanted his treats?", "max_5_yes": "Yes! Everywhere Max went, the moon was there too.", "max_6": "Mom smiled. \"The moon is very, very far away. That's why we can see it from everywhere we go.\"", "max_7": "Max thought about that. \"So everyone can see the same moon?\" \"That's right,\" said Mom. \"Even your friends who live far away.\"", "max_8": "Who explained the moon to Max? A cat, his mom, or an owl?", "max_8_yes": "That's right! Max's mom explained it.", "max_9": "That night, Max looked out his window and whispered, \"Sleep tight, moon. Say sleep tight to my friends, too.\"", "max_10": "How do you think Max felt at the end? Angry, calm and happy, or scared?", "max_10_yes": "Yes! Max felt calm and happy, saying sleep tight to the moon.", "max_11": "Was the moon really following Max? No, it just looks that way because it's so far away. Yes, it follows puppies. Or yes, it wanted to play?", "max_11_yes": "That's right! The moon is so far away that we can see it from everywhere we go. So it only looks like it's following us.", "max_12": "Why do you think Max asked the moon to say sleep tight to his friends, too? Because his friends were in his room, because the moon is a telephone, or because his friends can see the same moon?", "max_12_yes": "Yes! Everyone sees the same moon. So looking at it made Max feel close to his friends, even the ones far away.", "rosie_title": "Rosie's Lemonade Stand.", "rosie_0": "It was a hot, sunny day. Rosie the raccoon had a great idea. \"I'll make lemonade!\"", "rosie_1": "First, Rosie picked yellow lemons from the lemon tree.", "rosie_2": "Next, she squeezed the lemons, and added cold water and a little sugar. Then she stirred, and stirred, and stirred.", "rosie_3": "What did Rosie do first? Stir the lemonade, pick the lemons, or sell the lemonade?", "rosie_3_yes": "Yes! First, Rosie picked the lemons.", "rosie_4": "Rosie set up her stand. Her very first customer was Turtle. Turtle took a sip, and made a funny face. \"Too sour!\"", "rosie_5": "Rosie tasted it. Turtle was right! So she added more sugar, and stirred again. \"Now try it!\"", "rosie_6": "What was wrong with the first lemonade? Was it too hot, too sour, or too salty?", "rosie_6_yes": "Yes! It was too sour, so Rosie added more sugar.", "rosie_7": "\"Mmm, perfect!\" said Turtle. Soon, Bunny, Duck, and Fox all came for a cup.", "rosie_8": "How many friends came for lemonade after Turtle? Three, one, or ten?", "rosie_8_yes": "Yes! Bunny, Duck, and Fox. That's three friends!", "rosie_9": "Rosie sold five cups of lemonade. She used her coins to buy a brand new book, for everyone at the library to share.", "rosie_10": "What did Rosie buy with her coins? A teddy bear, an ice cream, or a book for the library?", "rosie_10_yes": "Yes! A new book for everyone at the library to share.", "rosie_11": "When Turtle said the lemonade was too sour, what did Rosie do well? She got mad at Turtle. She listened, and made it better. Or she gave up?", "rosie_11_yes": "Yes! Rosie listened, tasted it herself, and made it better. Listening helps us learn and do better.", "rosie_12": "Rosie bought a book for everyone at the library to share. What does that tell us about Rosie? That she doesn't like books, that she wanted to keep a secret, or that she is kind and likes to share?", "rosie_12_yes": "Yes! Rosie is kind. She worked hard, and then used her coins to make something nice for everyone.", "poppy_title": "Poppy Takes the Plunge.", "poppy_0": "Poppy was a little penguin who lived on the cold, snowy ice.", "poppy_1": "All the other penguins loved to dive into the water. Splash! Splash! But Poppy was scared.", "poppy_2": "How did Poppy feel about diving at first? Excited, scared, or sleepy?", "poppy_2_yes": "Yes! Poppy felt scared at first. And that's okay.", "poppy_3": "Poppy's grandpa waddled over. \"Being scared is okay,\" he said. \"Let's start small.\"", "poppy_4": "First, Poppy dipped one foot in the water. Brr! Then she slid in, all the way up to her tummy.", "poppy_5": "Who helped Poppy? A whale, her grandpa, or a crab?", "poppy_5_yes": "That's right! Poppy's grandpa helped her start small.", "poppy_6": "At last, Poppy took a deep breath, and jumped in. Splash! Under the water, she could swim fast, like a little rocket!", "poppy_7": "Poppy saw bright fish, wavy seaweed, and a smiling crab. \"The water is wonderful!\" she said.", "poppy_8": "What did Poppy see under the water? Fish and a crab, cars, or a lion?", "poppy_8_yes": "Yes! Bright fish, wavy seaweed, and a smiling crab.", "poppy_9": "From then on, Poppy was the first one to dive in, every single day. Starting small helped her be brave.", "poppy_10": "What helped Poppy be brave? Eating cake, holding a balloon, or starting small?", "poppy_10_yes": "Yes! Starting small, one step at a time, helped Poppy be brave.", "poppy_11": "Why do you think Grandpa said being scared is okay? Because penguins never get scared, because everyone feels scared sometimes, or because he wanted Poppy to go home?", "poppy_11_yes": "Yes! Everyone feels scared sometimes, even grown-ups. Grandpa wanted Poppy to know that her feelings were okay.", "poppy_12": "How did Poppy's feelings change, from the beginning of the story to the end? From happy to sad, from sleepy to hungry, or from scared to brave and happy?", "poppy_12_yes": "Yes! Poppy started out scared, and ended up brave and happy. Feelings can change, a little at a time.", "ziggy_title": "Ziggy Finds a Friend.", "ziggy_0": "Ziggy was a little robot who lived on a space station, high above the Earth.", "ziggy_1": "Ziggy felt lonely. \"I wish I had a friend to play with,\" he said. So he climbed into his rocket. Zoom!", "ziggy_2": "Why did Ziggy go on a trip? To get some pizza, to find a friend, or to take a nap?", "ziggy_2_yes": "Yes! Ziggy was lonely, and wanted to find a friend.", "ziggy_3": "First, Ziggy landed on the Moon. It was gray and bumpy, and very quiet. Nobody was there.", "ziggy_4": "Next, he zoomed to a red, dusty planet. He found rocks, and more rocks, but no friends.", "ziggy_5": "What color was the dusty planet? Blue, red, or green?", "ziggy_5_yes": "Yes! It was a red, dusty planet.", "ziggy_6": "Then Ziggy flew to a planet with big, beautiful rings. On one of the rings sat a little alien, waving hello!", "ziggy_7": "\"Hi! I'm Nova,\" said the alien. \"Want to play hide and seek around the rings?\" Ziggy beeped happily. \"Yes, please!\"", "ziggy_8": "Where did Ziggy find a friend? On the planet with rings, on the Moon, or on the red planet?", "ziggy_8_yes": "Yes! Nova lived on the planet with rings.", "ziggy_9": "Now Ziggy and Nova visit each other every week. And the space station isn't lonely anymore.", "ziggy_10": "Where did Ziggy go first? The planet with rings, the red planet, or the Moon?", "ziggy_10_yes": "Yes! First the Moon, then the red planet, and then the planet with rings.", "ziggy_11": "How did Ziggy feel on the Moon, and on the red planet, when nobody was there? Silly and giggly, lonely and a little sad, or angry and grumpy?", "ziggy_11_yes": "Yes! Ziggy felt lonely, because there was nobody there to play with.", "ziggy_12": "What helped Ziggy find a friend in the end? He hid in his room. He went to sleep. Or he kept trying, and didn't give up?", "ziggy_12_yes": "Yes! The first two places were empty, but Ziggy kept trying. And on the third planet, he found Nova!", "bk_pick": "Pick a book, and let's read together!", "bk_qtime": "Question time!", "bk_again": "Hmm, not quite. Let's listen to that part again.", "bk_think": "Now, let's think a little deeper about the story!", "bk_one_more": "Here's one more thinking question!", "bk_again2": "Hmm, let's think about that some more. Here's that part of the story again.", "rh_intro": "Let's play Rhyme Time! Rhyming words sound the same at the end, like cat and hat. Listen, then tap the picture that rhymes!", "rw_hat": "Hat", "rw_bat": "Bat", "rw_frog": "Frog", "rw_tree": "Tree", "rw_key": "Key", "rw_car": "Car", "rw_spoon": "Spoon", "rw_balloon": "Balloon", "rw_snake": "Snake", "rw_chair": "Chair", "rw_pear": "Pear", "rw_box": "Box", "rw_socks": "Socks", "rw_boat": "Boat", "rw_coat": "Coat", "rw_house": "House", "rw_whale": "Whale", "rw_rock": "Rock", "rw_sled": "Sled", "rw_rose": "Rose", "rw_rain": "Rain", "rw_cat": "Cat", "rw_dog": "Dog", "rw_bee": "Bee", "rw_star": "Star", "rw_moon": "Moon", "rw_cake": "Cake", "rw_bear": "Bear", "rw_fox": "Fox", "rw_goat": "Goat", "rw_mouse": "Mouse", "rw_snail": "Snail", "rw_clock": "Clock", "rw_bed": "Bed", "rw_nose": "Nose", "rw_train": "Train", "rh_q_cat": "Cat! What rhymes with cat?", "rh_ok_cat_hat": "Cat and hat! They rhyme!", "rh_ok_cat_bat": "Yes! Cat, bat. They sound the same at the end!", "rh_q_dog": "Dog! What rhymes with dog?", "rh_ok_dog_frog": "Dog, frog! You found the rhyme!", "rh_q_bee": "Bee! What rhymes with bee?", "rh_ok_bee_tree": "Bee and tree! They rhyme!", "rh_ok_bee_key": "Yes! Bee, key. They sound the same at the end!", "rh_q_star": "Star! What rhymes with star?", "rh_ok_star_car": "Star, car! You found the rhyme!", "rh_q_moon": "Moon! What rhymes with moon?", "rh_ok_moon_spoon": "Moon and spoon! They rhyme!", "rh_ok_moon_balloon": "Yes! Moon, balloon. They sound the same at the end!", "rh_q_cake": "Cake! What rhymes with cake?", "rh_ok_cake_snake": "Cake, snake! You found the rhyme!", "rh_q_bear": "Bear! What rhymes with bear?", "rh_ok_bear_chair": "Bear and chair! They rhyme!", "rh_ok_bear_pear": "Yes! Bear, pear. They sound the same at the end!", "rh_q_fox": "Fox! What rhymes with fox?", "rh_ok_fox_box": "Fox, box! You found the rhyme!", "rh_ok_fox_socks": "Fox and socks! They rhyme!", "rh_q_goat": "Goat! What rhymes with goat?", "rh_ok_goat_boat": "Yes! Goat, boat. They sound the same at the end!", "rh_ok_goat_coat": "Goat, coat! You found the rhyme!", "rh_q_mouse": "Mouse! What rhymes with mouse?", "rh_ok_mouse_house": "Mouse and house! They rhyme!", "rh_q_snail": "Snail! What rhymes with snail?", "rh_ok_snail_whale": "Yes! Snail, whale. They sound the same at the end!", "rh_q_clock": "Clock! What rhymes with clock?", "rh_ok_clock_rock": "Clock, rock! You found the rhyme!", "rh_q_bed": "Bed! What rhymes with bed?", "rh_ok_bed_sled": "Bed and sled! They rhyme!", "rh_q_nose": "Nose! What rhymes with nose?", "rh_ok_nose_rose": "Yes! Nose, rose. They sound the same at the end!", "rh_q_train": "Train! What rhymes with train?", "rh_ok_train_rain": "Train, rain! You found the rhyme!", "rh_no0": "Hmm, those don't rhyme. Try another one!", "rh_no1": "Not quite! Listen to the ends of the words, and try again.", "rh_no2": "Oops! That one doesn't rhyme. Pick another!", "dt_intro": "Let's play dot to dot! Start at number one, and connect the dots in order. What will it be?", "dt_go": "Start at number one! What will it be?", "dt_find": "Oops! Find the next number.", "n_11": "Eleven!", "n_12": "Twelve!", "n_13": "Thirteen!", "n_14": "Fourteen!", "n_15": "Fifteen!", "n_16": "Sixteen!", "n_17": "Seventeen!", "n_18": "Eighteen!", "n_19": "Nineteen!", "n_20": "Twenty!", "dt_done_star": "Twinkle, twinkle! You made a star!", "dt_done_heart": "You made a heart! I love it!", "dt_done_house": "You made a house! Knock, knock! Who's home?", "dt_done_fish": "You made a fish! Swish, swish, swim!", "dt_done_boat": "You made a sailboat! Sail away!", "dt_done_rocket": "You made a rocket! Three, two, one, blast off!", "dt_done_apple": "You made an apple! Crunch, crunch, yum!", "dt_done_icecream": "You made an ice cream cone! Yummy!", "sc_pick": "Let's be scientists! Pick an experiment to try.", "sc_great": "Great experimenting! You're a real scientist!", "sc_eq_1": "The ground under our feet is made of giant pieces of rock, called plates. They fit together like a puzzle, and they move very, very slowly.", "sc_eq_2": "Push the plates together! Keep pushing!", "sc_eq_3": "The rocks are getting squished. The pressure is building!", "sc_eq_4": "Snap! The plates slipped, and the ground shook! That's an earthquake!", "sc_eq_5": "The shaking spreads out in waves, like ripples in a pond. That's why people far away can feel it too.", "sc_vo_1": "Deep under the ground, it's so hot that rock melts into a thick, goopy liquid, called magma.", "sc_vo_2": "Tap the magma to heat it up, and build the pressure!", "sc_vo_3": "The magma is rising. The pressure is building!", "sc_vo_4": "Kaboom! The magma bursts out of the top! When it comes out, we call it lava.", "sc_vo_5": "When the lava cools down, it turns into hard, new rock. Volcanoes can even make brand new islands!", "sc_li_1": "Sunlight looks white, but it's really made of all the colors of the rainbow, mixed together!", "sc_li_2": "Drag the glass prism into the beam of light.", "sc_li_3": "Wow! The prism bends the light, and spreads it out into all its colors!", "sc_li_4": "Raindrops bend sunlight the very same way. That's how a rainbow is made! Tap the colors to hear their names.", "sc_fl_1": "Some things float on top of water, and some things sink to the bottom. Let's test them!", "sc_fl_2": "Drag something into the water. Will it sink, or float?", "sc_fl_s": "It sinks!", "sc_fl_f": "It floats!", "sc_fl_3": "Things that are heavy for their size, like a rock or a key, sink. Things that are light for their size, or full of air, like a duck or a boat, float!", "sc_mg_1": "A magnet has an invisible pull! It can pull some metal things toward it, like things made of iron or steel.", "sc_mg_2": "Drag the magnet around. What will it pick up?", "sc_mg_3": "Click! The magnet pulled it right in!", "sc_mg_4": "That one won't stick. Magnets don't pull wood, plastic, or cloth.", "sc_mg_5": "You found all the metal things! Magnets pull things made of iron and steel.", "sc_pl_1": "Plants make their own food! To grow, they need water, sunlight, and air.", "sc_pl_2": "Tap the watering can to give the seed some water. Then tap the sun to make it shine.", "sc_pl_w": "It needs some water too!", "sc_pl_s": "It needs some sunshine too!", "sc_pl_g1": "Look, a little sprout!", "sc_pl_g2": "It's growing bigger leaves!", "sc_pl_g3": "A flower bud!", "sc_pl_3": "A beautiful flower! Its leaves use sunlight to turn water and air into food.", "sc_wc_1": "The water on Earth goes around and around, in a big circle called the water cycle.", "sc_wc_2": "Tap the sun to warm up the ocean.", "sc_wc_3": "The sun warms the water, and it floats up into the sky as tiny drops, too small to see. That's called evaporation.", "sc_wc_4": "The tiny drops cool down, and join together to make a cloud. Now drag the cloud over the mountains!", "sc_wc_5": "The cloud is full, so it rains! The rain runs down the river, and back to the ocean. And then it all starts again!", "sc_dn_1": "Why do we have day and night? Because the Earth is always spinning, like a top!", "sc_dn_2": "Spin the Earth with your finger, and watch the little house.", "sc_dn_3": "Now the house is facing away from the sun. It's nighttime!", "sc_dn_4": "And now it's facing the sun again. Good morning! One whole spin takes one whole day.", "sc_so_1": "Sound is made when something wiggles back and forth, really fast. That's called a vibration!", "sc_so_2": "Pluck the strings! Watch them wiggle.", "sc_so_3": "The wiggles push the air, and the air carries the sound all the way to your ears!", "sc_so_4": "Did you hear? Short strings make high sounds, and long strings make low sounds.", "sc_gr_1": "Why do things fall down? Because of gravity! Gravity is an invisible pull, that pulls everything toward the ground.", "sc_gr_2": "Tap the astronaut to make her jump on Earth.", "sc_gr_3": "Earth's gravity pulls her right back down. Now tap the Moon button, to visit the Moon!", "sc_gr_4": "Tap her to jump on the Moon!", "sc_gr_5": "Wheee! The Moon is much smaller than Earth, so its gravity pulls less. She can jump super high!", "sc_ma_1": "Water can be a solid, a liquid, or a gas! It all depends on how hot or cold it is.", "sc_ma_2": "Drag the thermometer up, to heat the ice.", "sc_ma_3": "The ice is melting! Now it's a liquid, called water. Its tiny pieces can slide around.", "sc_ma_4": "It's boiling! The water is turning into steam, a gas. Its tiny pieces zoom all over!", "sc_ma_5": "Now drag the thermometer down, to cool it off.", "sc_ma_6": "Brrr! It froze back into ice, a solid! Its tiny pieces are packed together, and they hold still.", "dt_done_sun": "You made the sun! It's so bright and warm!", "dt_done_moon": "You made the moon! Good night, moon!", "dt_done_pine": "You made a tree! It's so tall!", "dt_done_butterfly": "You made a butterfly! Flap, flap, flap!", "dt_done_cat": "You made a kitty cat! Meow!", "dt_done_car": "You made a car! Beep, beep!", "dt_done_umbrella": "You made an umbrella! Drip, drop!", "dt_done_balloon": "You made a balloon! Up, up, and away!", "dt_done_crown": "You made a crown, fit for a king or a queen!", "dt_done_mushroom": "You made a mushroom! Boing, boing!", "th_intro": "Welcome to my treehouse! You can use your stars to make it cozy. Tap something in the shop to buy it!", "th_back": "Welcome back to my treehouse! What should we add today?", "th_gift": "Here's a housewarming present: three shiny stars to get you started!", "th_need": "Ooh, that one needs more stars. Play a game to earn some more!", "th_drag": "You can drag things around to move them anywhere you like!", "th_off": "Back to my regular feathers!", "th_crown": "A crown! I feel like a king!", "th_tophat": "A fancy hat! How do I look?", "th_shades": "Cool sunglasses! I look so cool!", "th_bow": "A pretty bow! Thank you!", "th_teddy": "A teddy bear! I'll give it a big hug!", "th_plant": "A plant! I'll water it every day.", "th_books": "Books! Will you read with me?", "th_sunflower": "A sunflower! It's so bright and happy!", "th_guitar": "A guitar! Tap it to make music!", "th_lights": "Twinkly lights! So sparkly!", "th_swing": "A swing! Wheee!", "th_kite": "A kite! Look how high it flies!", "th_balloons": "Balloons! It's a party!", "th_fishbowl": "A fish friend! Hello, little fish!", "th_butterfly": "A butterfly! Tap it and watch it fly!", "th_disco": "A disco ball! Tap it, and let's dance!", "th_owl": "A new friend! Hello, owl!", "th_rainbow": "A rainbow! Look at all the colors!", "th_painting": "A painting! It's beautiful!", "th_ladybug": "A ladybug! Hello, little bug!", "th_couch": "A comfy couch! Time for a nap?", "th_kitten": "A kitten! Meow! Tap her for a cuddle!", "th_puppy": "A puppy friend! Woof, woof!", "th_bird": "A little bird! Tweet, tweet!", "th_frog": "A froggy! Tap it, and watch it jump!", "th_bee": "A buzzy bee! Buzz, buzz!", "th_hedgehog": "A hedgehog! Tap it, and watch it roll!", "th_unicorn": "A unicorn! It's magical!", "th_dragon": "A friendly dragon! Tap it to see a puff of smoke!", "th_drum": "A drum! Boom, boom, boom!", "th_piano": "A piano! Let's play a song!", "th_trumpet": "A trumpet! Toot, toot!", "th_train": "A toy train! Choo, choo!", "th_car": "A race car! Vroom, vroom!", "th_ball": "A bouncy ball! Boing, boing!", "th_yoyo": "A yo-yo! Up and down it goes!", "th_skateboard": "A skateboard! Let's roll!", "th_telescope": "A telescope! Tap it to look at the stars!", "th_moonlamp": "A moon lamp! Tap it to make it nighttime!", "th_rocket": "A rocket! Tap it for blast off!", "th_ufo": "A flying saucer! Beep, boop!", "th_ferris": "A Ferris wheel! Round and round it goes!", "th_popper": "A party popper! Tap it for confetti!", "th_bubbles": "A bubble machine! So many bubbles!", "th_cake": "A birthday cake! Yum!", "th_cookie": "Cookies! Crunch, crunch!", "th_icecream": "Ice cream! It's my favorite!", "th_pumpkin": "A pumpkin! It glows in the dark!", "th_snowman": "A snowman! Tap it to make it snow!", "th_chest": "A treasure chest! Tap it to open it!", "th_cap": "A cool cap! How do I look?", "th_big_need": "That one needs a bigger treehouse! Save up twenty stars, and we can build one.", "th_big_save": "Let's save up! When you have twenty stars, we can build a bigger treehouse.", "th_big_ok": "Hooray! Our treehouse is so much bigger now! Look at all the new things we can get!", "th_night": "Nighty night, treehouse!", "th_day": "Good morning, sunshine!", "sc_sh_1": "A shadow is made when something blocks the light. The light can't go through it, so it leaves a dark shape behind!", "sc_sh_2": "Drag the flashlight around, and watch the teddy bear's shadow.", "sc_sh_3": "When the light is low, the shadow gets long. When the light is high, the shadow gets short!", "sc_sh_4": "And the shadow is always on the other side, away from the light.", "sc_wi_1": "Wind is air that is moving! We can't see air, but we can see what it pushes.", "sc_wi_2": "Tap and hold the fan to make some wind.", "sc_wi_3": "Whoosh! The moving air spins the pinwheel, and pushes the boat across the water!", "sc_wi_4": "The harder the wind blows, the faster things move. Wind can even turn giant windmills, to make electricity!", "sc_st_1": "Let's make static electricity! Everything is made of tiny bits, and some of them have a little electric charge.", "sc_st_2": "Rub the balloon on the hair, back and forth.", "sc_st_3": "Look! The hair is standing up! Rubbing moved tiny charges from the hair onto the balloon.", "sc_st_4": "Now the balloon and the hair pull toward each other. That's static electricity! It's the same zap you can feel on a dry winter day.", "sc_le_1": "A lever is a simple machine that helps us lift heavy things. A seesaw is a lever!", "sc_le_2": "The elephant is too heavy for the mouse. Slide the triangle under the seesaw, closer to the elephant.", "sc_le_3": "Now tap the mouse to push down!", "sc_le_4": "Wow! The little mouse lifted the big elephant! When the heavy thing is close to the middle, a lever makes lifting easy.", "sc_le_no": "Hmm, it's still too heavy. Move the triangle closer to the elephant.", "sc_fr_1": "Friction is a rubbing force, that slows things down when they slide or roll.", "sc_fr_2": "Pick a floor, then tap the car to let it roll down the ramp.", "sc_fr_3": "Bumpy floors, like carpet, have lots of friction. They slow the car down fast!", "sc_fr_4": "Smooth, slippery floors, like ice, have very little friction. The car goes really far!", "sc_ci_1": "Electricity is energy that flows through wires, like water through a pipe. It needs a full loop to travel around, called a circuit.", "sc_ci_2": "Drag the loose wire, and connect it to the battery.", "sc_ci_3": "The circuit is complete! Electricity flows all the way around, and the light bulb turns on!", "sc_ci_4": "Now tap the switch. A switch opens the loop, so the electricity stops.", "sc_ci_5": "The light turned off! That's how the light switches in your house work.", "sc_co_1": "Red, yellow, and blue are called primary colors. When you mix them, you can make brand new colors!", "sc_co_2": "Drag two paint cans into the bowl, and see what color you make!", "sc_co_orange": "Red and yellow make orange!", "sc_co_green": "Yellow and blue make green!", "sc_co_purple": "Red and blue make purple!", "sc_co_3": "You made all three! Orange, green, and purple are called secondary colors.", "sc_bf_1": "A butterfly changes a lot as it grows. It starts out as a tiny egg on a leaf!", "sc_bf_2": "Tap the egg to help it hatch.", "sc_bf_3": "A hungry caterpillar! Drag leaves to feed it, so it can grow big.", "sc_bf_4": "Now the caterpillar makes a cozy case, called a chrysalis. Inside, it's changing! Tap it to help it along.", "sc_bf_5": "Ta-da! A beautiful butterfly! Egg, caterpillar, chrysalis, butterfly. That's called a life cycle.", "sc_bo_1": "Inside your body, you have bones! Your bones hold you up, and keep your insides safe.", "sc_bo_2": "Drag the X-ray scanner over the kid, to see the bones inside.", "sc_bo_3": "That's the skull! It protects your brain, like a helmet.", "sc_bo_4": "Those are the ribs! They make a cage that protects your heart and lungs.", "sc_bo_5": "Those are the leg bones! Your thigh bone is the biggest bone in your body.", "sc_ge_1": "Germs are teeny, tiny living things, too small to see. Some of them can make us sick!", "sc_ge_2": "Let's wash these hands. First, tap the water to rinse them.", "sc_ge_3": "Water alone doesn't get all the germs off. Now tap the soap, and scrub, scrub, scrub!", "sc_ge_4": "Bubbles! The soap grabs onto the germs, so the water can wash them away.", "sc_ge_5": "Sparkling clean! Always wash with soap and water, for as long as it takes to sing the alphabet song.", "sc_se_1": "Why do we have seasons? Earth travels all the way around the sun once every year. And Earth is tilted, a little bit sideways, like it's leaning!", "sc_se_2": "Drag the Earth around the sun, and watch what happens to our house.", "sc_se_su": "Summer! Our part of Earth leans toward the sun. The sunlight is strong, and the days are long.", "sc_se_fa": "Fall! Our part of Earth starts leaning away. The days get shorter and cooler.", "sc_se_wi": "Winter! Now our part of Earth leans away from the sun. The sunlight is weaker, and the days are short.", "sc_se_sp": "Spring! We're leaning back toward the sun. The days get longer and warmer.", "sc_se_3": "So seasons happen because Earth is tilted, not because it gets closer to the sun. One whole trip around the sun takes one whole year!", "sc_ss_1": "Our solar system has the sun in the middle, and eight planets going around and around it.", "sc_ss_2": "Tap each planet to meet it!", "sc_ss_mercury": "Mercury! It's the smallest planet, and the closest to the sun.", "sc_ss_venus": "Venus! It's the hottest planet, covered in thick, cloudy air.", "sc_ss_earth": "Earth! That's our home. It's the only planet we know of with living things.", "sc_ss_mars": "Mars! The red planet. It's covered in rusty red dust.", "sc_ss_jupiter": "Jupiter! The biggest planet of all. It has a giant storm called the Great Red Spot.", "sc_ss_saturn": "Saturn! It has beautiful rings, made of ice and rock.", "sc_ss_uranus": "Uranus! It spins on its side, like a ball rolling along.", "sc_ss_neptune": "Neptune! The farthest planet from the sun. It's very cold, and very windy.", "sc_ss_3": "You met all eight planets! Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune!", "sc_ga_1": "Let's zoom out, and see where we live in space! Tap the zoom out button.", "sc_ga_l1": "This is Earth, our home planet. It's a giant ball of rock and water, floating in space.", "sc_ga_l2": "Earth goes around the sun, with seven other planets. This is our solar system!", "sc_ga_l3": "Our sun is a star! All of those twinkling stars are suns too. They're just very, very far away.", "sc_ga_l4": "This giant swirl of stars is our galaxy, called the Milky Way! It has billions and billions of stars, and we live way out here, on one of its arms.", "sc_ga_l5": "And there are more galaxies out there than anyone can count! Space is enormous!", "sc_fo_1": "Food is fuel for your body! Just like a car needs gas, you need food for the energy to run, play, think, and grow.", "sc_fo_2": "Let's make a healthy plate! Drag a fruit, a vegetable, a grain, and a protein onto the plate.", "sc_fo_fruit": "A fruit! Sweet and juicy.", "sc_fo_veg": "A vegetable! Crunchy and good for you.", "sc_fo_grain": "A grain! Grains give you lots of energy.", "sc_fo_protein": "A protein! Protein helps your muscles grow strong.", "sc_fo_t": "A treat gives you a quick burst of energy, but it runs out fast! Treats are fine once in a while.", "sc_fo_3": "A healthy plate! Foods like these give you energy that lasts, and help your muscles, bones, and brain grow strong!", "sc_vi_1": "Viruses are super tiny germs, much too small to see. If they get inside your body, they make copies of themselves, and that can make you feel sick.", "sc_vi_2": "Uh oh, viruses got in! Your body has defenders, called white blood cells. Tap the viruses to help the defenders catch them!", "sc_vi_3": "Hooray, the defenders won! Rest, water, and medicine from a doctor can help you feel better while your body fights.", "sc_vi_4": "Now let's learn about vaccines! Tap the vaccine.", "sc_vi_5": "A vaccine shows your defenders a safe picture of the germ, like a wanted poster. Now they know just what to look for!", "sc_vi_6": "Here come the viruses again! This time, the defenders know them right away, and catch them super fast. That's how vaccines help keep us from getting sick, or from getting very sick.", "th_in_need": "This door goes inside my treehouse! It costs five stars to open it. Play a game to earn some more!", "th_in_open": "Ta-da! The door is open! Come on in!", "th_in_hi": "Welcome inside my treehouse! It's so cozy in here. Let's decorate it together!", "th_in_back": "Back inside! What should we add today?", "th_out": "Back outside! Tap the door whenever you want to go back in.", "th_in_only": "That one goes inside! Tap the door to go in.", "th_moved": "Some of your things moved inside the treehouse! Tap the door to go see them!", "th_big_ok2": "Hooray! Our treehouse is so much bigger now, inside and out! Look at all the new things we can get!", "th_bed": "A cozy bed! Tap it, and I'll take a little nap.", "th_lantern": "A lantern! Tap it to make the room warm and glowy.", "th_clock": "A cuckoo clock! Tick, tock, cuckoo!", "th_radio": "A radio! Tap it, and let's dance!", "th_teapot": "A teapot! Would you like a cup of tea?", "th_easel": "An easel! Let's paint something beautiful!", "th_globe": "A globe! Tap it to spin the whole wide world!", "th_robot": "A robot friend! Beep, boop!", "th_hamster": "A hamster! Tap it, and watch it run!", "th_crystal": "A crystal ball! Tap it for a little magic!", "th_nap": "Mmm, so cozy. Just a little nap."};

      if (left.length === 1 && clues.length >= 2) { clues.fits = fits; break; }
    }
    const fits = clues.fits;
    const clipOf = cl => cl.k === 'c' ? `lq_det_${cl.pos ? 'is' : 'not'}_${cl.v}` : `lq_det_${cl.k}_${cl.pos ? 'y' : 'n'}`;
    const chipOf = cl => `<span class="clue">${cl.pos ? '' : kw('NOT', 'not')}${cl.k === 'c' ? `<i class="swatch-dot big" style="background:${MON_COL[cl.v][0]}"></i>` : CLUE_ICON[cl.k]}</span>`;
    box.innerHTML = `<div class="cluebar"></div><div class="monsters"></div>`;
    const bar = box.querySelector('.cluebar'), grid = box.querySelector('.monsters');
    let shown = 0;
    const els = monsters.map(m => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'monster'; b.innerHTML = monsterSVG(m); b.setAttribute('aria-label', 'Monster');
      b.addEventListener('click', () => tapMon(m, b)); grid.appendChild(b); m.el = b; return b;
    });
    const active = () => clues.slice(0, shown);
    const ok = m => active().every(cl => fits(m, cl));
    let busy = false;
    function reveal() {
      const cl = clues[shown++];
      bar.querySelectorAll('.clue').forEach(c => c.classList.add('old'));
      bar.insertAdjacentHTML('beforeend', chipOf(cl));
      introIds = [clipOf(cl)];
      return cl;
    }
    // Each clue: tap every monster that MATCHES it. Matching ones get a check and stay; the rest then leave.
    async function tapMon(m, b) {
      if (busy || m.gone || m.won || m.kept) return;
      if (!ok(m)) { shakeEl(b); Sound.fx.wrong(); nag('lq_det_hint'); return; }
      m.kept = true; b.classList.add('kept'); Sound.fx.snap();
      const stillToTap = monsters.filter(x => !x.gone && ok(x) && !x.kept);
      if (stillToTap.length) return;
      busy = true; const my = tok;
      await wait(500); if (my !== tok) return;
      const leaving = monsters.filter(x => !x.gone && !ok(x));
      leaving.forEach((x, i) => setTimeout(() => { x.gone = true; x.el.classList.add('bye'); x.el.disabled = true; Sound.fx.pop(); }, i * 220));
      await wait(leaving.length * 220 + 500); if (my !== tok) return;
      monsters.forEach(x => { x.kept = false; x.el.classList.remove('kept'); });
      const left = monsters.filter(x => !x.gone);
      if (left.length === 1) { target.won = true; target.el.classList.add('found'); bar.classList.add('done'); solved('lq_det_found'); return; }
      const cl = reveal(); Sound.fx.place(); busy = false;
      Sound.say(['lq_det_more', clipOf(cl)]);
    }
    const first = reveal();
    opening('det', [clipOf(first)]);
  }

  /* ---- Magic Machine: IF this goes in, THEN that comes out (and chains) ---- */
  function machine() {
    const chain = round >= 2 && Math.random() < .5;
    const it = shuffle(MACH_ITEMS);
    let rules, input, answer, choices;
    if (!chain) { rules = [[it[0], it[3]], [it[1], it[4]], [it[2], it[5]]]; const r = pick(rules); input = r[0]; answer = r[1]; choices = shuffle(rules.map(x => x[1])); }
    else { rules = [[it[0], it[1]], [it[1], it[2]], [it[3], it[4]]]; input = it[0]; answer = it[2]; choices = shuffle([it[1], it[2], it[4]]); }
    box.innerHTML = `<div class="rules">${shuffle(rules).map(([a, b]) => `<div class="rule" data-in="${a}">${kw('IF', 'if')}<span class="ri">${a}</span><span class="arrow">➜</span>${kw('THEN', 'if')}<span class="ri">${b}</span></div>`).join('')}</div>
      <div class="machrow"><span class="inbox">${input}</span><div class="mach"><span class="gear g1">⚙️</span><span class="gear g2">⚙️</span><i class="lt l1"></i><i class="lt l2"></i><i class="lt l3"></i><span class="mlabel">Pip's<br>machine</span></div><span class="outbox">?</span></div>
      <div class="mchoices"></div>`;
    const ch = box.querySelector('.mchoices'), mach = box.querySelector('.mach'), inbox = box.querySelector('.inbox'), outbox = box.querySelector('.outbox');
    let busy = false;
    choices.forEach(e => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mchoice'; b.textContent = e;
      b.addEventListener('click', async () => {
        if (busy) return;
        if (e !== answer) {
          shakeEl(b); Sound.fx.wrong(); nag('lq_mach_no');
          const r = box.querySelector(`.rule[data-in="${input}"]`); r.classList.remove('glow'); void r.offsetWidth; r.classList.add('glow'); return;
        }
        busy = true; b.classList.add('picked'); const my = tok;
        inbox.classList.add('drop'); mach.classList.add('run'); Sound.fx.flip();
        await wait(900); if (my !== tok) return;
        if (chain) { outbox.textContent = choices.find(x => x === rules[0][1]) || rules[0][1]; outbox.classList.add('pop'); Sound.fx.place(); await wait(800); if (my !== tok) return;
          outbox.classList.remove('pop'); void outbox.offsetWidth; outbox.textContent = '?'; Sound.fx.flip(); await wait(700); if (my !== tok) return; }
        mach.classList.remove('run'); outbox.textContent = answer; outbox.classList.add('pop', 'win'); Sound.fx.snap();
        solved('lq_mach_ok');
      });
      ch.appendChild(b);
    });
    opening('mach', [chain ? 'lq_mach_chain' : 'lq_mach_q']);
  }

  /* ---- Sorting Belt: AND / OR rules, yes basket or no basket ---- */
  function sorting() {
    const op = Math.random() < .5 ? 'and' : 'or', c = pick(Object.keys(LG_COL)), s = pick(LG_SHP);
    const oc = () => pick(Object.keys(LG_COL).filter(x => x !== c)), os = () => pick(LG_SHP.filter(x => x !== s));
    const items = shuffle(op === 'and'
      ? [{ c, s }, { c, s }, { c, s: os() }, { c, s: os() }, { c: oc(), s }, { c: oc(), s }]
      : [{ c, s: os() }, { c, s: os() }, { c: oc(), s }, { c: oc(), s }, { c: oc(), s: os() }, { c: oc(), s: os() }]);
    const isYes = it => op === 'and' ? (it.c === c && it.s === s) : (it.c === c || it.s === s);
    box.innerHTML = `<div class="sruleWrap"><div class="srule"><span class="cond cc">${sw(c)}<i class="mark"></i></span>${kw(op.toUpperCase(), op)}<span class="cond cs"><span class="sshape">${shapeSVG(s, c, true)}</span><i class="mark"></i></span></div>
      <div class="need ${op}">${op === 'and' ? 'Needs <b>BOTH</b> <i>✓</i><i>✓</i>' : 'Needs just <b>ONE</b> <i>✓</i>'}</div></div>
      <div class="belt"><div class="stripes"></div><div class="onbelt"></div></div>
      <div class="baskets"><button class="basket yes" type="button" aria-label="Yes basket"><span>✔</span><b class="cnt">0</b></button><button class="basket no" type="button" aria-label="No basket"><span>✘</span><b class="cnt">0</b></button></div>`;
    const on = box.querySelector('.onbelt'), byes = box.querySelector('.basket.yes'), bno = box.querySelector('.basket.no');
    let i = 0, busy = false;
    const marks = [box.querySelector('.cc .mark'), box.querySelector('.cs .mark')];
    function setMarks(it) {
      if (!it) { marks.forEach(m => { m.className = 'mark'; m.textContent = ''; }); return; }
      [it.c === c, it.s === s].forEach((yes, k) => { marks[k].className = 'mark ' + (yes ? 'y' : 'n'); marks[k].textContent = yes ? '✓' : '✗'; });
    }
    function show() { setMarks(null); on.innerHTML = `<span class="sitem">${shapeSVG(items[i].s, items[i].c)}</span>`; Sound.fx.flip(); }
    async function drop(yes, btn) {
      if (busy || i >= items.length) return;
      const it = items[i], right = isYes(it) === yes, el = on.querySelector('.sitem');
      setMarks(it);
      if (!right) { shakeEl(el); shakeEl(btn); Sound.fx.wrong(); nag(`lq_sort_${op}_hint`); return; }
      busy = true; await wait(450); el.classList.add(yes ? 'toyes' : 'tono'); Sound.fx.snap();
      const cnt = btn.querySelector('.cnt'); cnt.textContent = +cnt.textContent + 1; btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');
      await wait(450); i++; busy = false;
      if (i >= items.length) { on.innerHTML = ''; solved('lq_sort_done'); } else show();
    }
    byes.addEventListener('click', () => drop(true, byes)); bno.addEventListener('click', () => drop(false, bno));
    show();
    opening('sort', [`lq_sort_${op}_${c}_${s}`]);
  }

  /* ---- Make It True: ALL / SOME / NONE by recoloring balloons ---- */
  function makeTrue() {
    const q = pick(['all', 'some', 'none']), c = pick(Object.keys(LG_COL)), others = Object.keys(LG_COL).filter(x => x !== c), n = 5;
    const good = cols => { const k = cols.filter(x => x === c).length; return q === 'all' ? k === n : q === 'none' ? k === 0 : (k > 0 && k < n); };
    let cols; do {
      cols = q === 'all' ? [...Array(n)].map(() => Math.random() < .45 ? c : pick(others))
        : q === 'none' ? [...Array(n)].map(() => Math.random() < .5 ? c : pick(others))
        : (Math.random() < .5 ? Array(n).fill(c) : [...Array(n)].map(() => pick(others)));
    } while (good(cols));
    const word = { all: 'ALL', some: 'SOME', none: 'NONE' }[q];
    box.innerHTML = `<div class="srule">${kw(word, 'qty')}<span class="goalb" style="background:${LG_COL[c]}"></span></div><div class="mitrow"></div><button class="checkbtn" type="button" aria-label="Check">✔</button>`;
    const row = box.querySelector('.mitrow'), chk = box.querySelector('.checkbtn');
    const bal = cols.map((col, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mitb'; b.style.setProperty('--bc', LG_COL[col]); b.setAttribute('aria-label', 'Balloon');
      b.addEventListener('click', () => {
        if (chk.disabled) return;
        cols[i] = cols[i] === c ? pick(others) : c; b.style.setProperty('--bc', LG_COL[cols[i]]);
        b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip'); Sound.fx.pop();
      });
      row.appendChild(b); return b;
    });
    chk.addEventListener('click', () => {
      if (chk.disabled) return;
      if (good(cols)) { chk.disabled = true; bal.forEach((b, i) => setTimeout(() => b.classList.add('yay'), i * 80)); solved(`lq_mit_ok_${q}`); }
      else { shakeEl(chk); Sound.fx.wrong(); nag('lq_mit_no'); }
    });
    opening('mit', [`lq_mit_${q}_${c}`]);
  }

  function next() {
    tok++; nagAt = 0; box.className = 'lq';
    const kinds = ['det', 'mach', 'sort', 'mit'];
    let kind = mode;
    if (mode === 'mix') { do { kind = pick(kinds); } while (kind === lastKind); }
    lastKind = kind; box.classList.add('lq-' + kind);
    ({ det: detective, mach: machine, sort: sorting, mit: makeTrue })[kind]();
  }
  next();
  return () => { tok++; };
}

function storyGame(root, api) {
  let book = null, pi = 0, readToMe = store.get('pr-readtome', true), tok = 0, hl = null, wrongOnce = false;
  const rtm = document.createElement('button'); rtm.type = 'button'; rtm.className = 'toggle'; rtm.innerHTML = '<span class="sw"></span>Read to me';
  rtm.setAttribute('aria-pressed', String(readToMe));
  rtm.addEventListener('click', () => { readToMe = !readToMe; store.set('pr-readtome', readToMe); rtm.setAttribute('aria-pressed', String(readToMe)); Sound.fx.tap(); if (!readToMe) Sound.stopVoice(); });
  const shelfBtn = document.createElement('button'); shelfBtn.type = 'button'; shelfBtn.className = 'chip'; shelfBtn.textContent = '📚 All books';
  shelfBtn.addEventListener('click', () => { Sound.fx.tap(); shelf(true); });
  tools.appendChild(shelfBtn); tools.appendChild(rtm);
  const box = document.createElement('div'); box.className = 'story'; root.appendChild(box);
  const pip = s => `<svg class="pip" viewBox="0 0 100 100">${PIP_ART}</svg>`;
  function art(sc) {
    const bg = SCENE_BG[sc.scene] ? `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">${SCENE_BG[sc.scene]}</svg>` : '';
    return `<div class="sart scene-${sc.scene}"><i class="sbg">${bg}</i>${sc.actors.map(([e, x, y, sz, an]) =>
      `<span class="actor ${an ? 'a-' + an : ''}" style="left:${x}%;top:${y}%;--sz:${sz}">${e === 'PIP' ? pip() : (illFor(e) || e)}</span>`).join('')}</div>`;
  }
  function stopHL() { if (hl) { cancelAnimationFrame(hl); hl = null; } }
  Sound.onStart = (id, dur) => {
    stopHL();
    const words = [...box.querySelectorAll('.stext:not(.q) .w')]; if (!words.length || box.dataset.clip !== id) return;
    // approximate read-along: spread the words over the clip, with small pauses after punctuation
    const wts = words.map(w => w.textContent.length + 1 + (/[.!?]["”]?$/.test(w.textContent) ? 5 : /[,;:]["”]?$/.test(w.textContent) ? 2.5 : 0));
    const total = wts.reduce((a, b) => a + b, 0); let acc = 0; const starts = wts.map(w => { const t = acc / total * dur; acc += w; return t; });
    const t0 = performance.now();
    (function step() {
      const t = (performance.now() - t0) / 1000; let k = starts.length - 1; while (k > 0 && starts[k] > t) k--;
      words.forEach((w, i) => { w.classList.toggle('on', i === k && t < dur); w.classList.toggle('read', i < k || t >= dur); });
      if (t < dur + .2) hl = requestAnimationFrame(step); else hl = null;
    })();
  };
  const wrap = t => t.split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');

  function shelf(talk) {
    tok++; stopHL(); Sound.stopVoice(); book = null; shelfBtn.hidden = true; rtm.hidden = true;
    box.innerHTML = `<div class="books">${BOOKS.map((b, i) => `<button class="bookcard" type="button" data-i="${i}">${art(b.cover)}<span class="btitle">${b.title}</span></button>`).join('')}</div>`;
    box.querySelectorAll('.bookcard').forEach(c => c.addEventListener('click', () => { Sound.fx.flip(); open(BOOKS[+c.dataset.i]); }));
    introIds = ['bk_pick']; if (talk) Sound.say('bk_pick');
  }
  async function open(b) {
    subLabel = b.title;
    book = b; pi = -1; shelfBtn.hidden = false; rtm.hidden = false; wrongOnce = false;
    Sound.preload([b.id + '_title']);
    box.innerHTML = `<div class="titlepage">${art(b.cover)}<h2>${b.title}</h2><button class="big-btn" type="button">Start reading ▶</button></div>`;
    box.querySelector('.big-btn').addEventListener('click', () => { Sound.fx.flip(); go(0); });
    introIds = [b.id + '_title']; Sound.say(introIds);
  }
  function dots() { return `<div class="pdots">${book.pages.map((p, i) => `<i class="${i === pi ? 'on' : i < pi ? 'done' : ''} ${p.q ? 'qd' : ''}"></i>`).join('')}</div>`; }
  function go(i) {
    tok++; stopHL(); Sound.stopVoice(); pi = i; wrongOnce = false;
    if (i >= book.pages.length) return finish();
    const p = book.pages[i], id = `${book.id}_${i}`;
    box.dataset.clip = id;
    if (p.t) {
      box.innerHTML = `<div class="spage flipin">${art(p)}<div class="stext">${wrap(p.t)}</div></div>
        <div class="snav"><button class="iconbtn sprev" type="button" aria-label="Back">◀</button>${dots()}<button class="iconbtn sread" type="button" aria-label="Read this page">🔊</button><button class="iconbtn snext" type="button" aria-label="Next page">▶</button></div>`;
      box.querySelector('.snext').addEventListener('click', () => { Sound.fx.flip(); go(pi + 1); });
      box.querySelector('.sprev').addEventListener('click', () => { if (pi > 0) { Sound.fx.flip(); go(pi - 1); } });
      box.querySelector('.sread').addEventListener('click', () => Sound.say(id, { silentCaption: true }));
      box.querySelector('.sprev').disabled = i === 0;
      introIds = [id]; caption('');
      if (readToMe) Sound.say(id, { silentCaption: true }).then(() => { if (box.dataset.clip === id) box.querySelector('.snext')?.classList.add('nudge'); });
      else box.querySelector('.snext').classList.add('nudge');
    } else {
      const back = book.pages[p.back];
      box.innerHTML = `<div class="spage qpage flipin${p.deep ? ' deepq' : ''}"><div class="qbanner">${pip()}<b>${p.deep ? 'Let’s think!' : 'Question time!'}</b>${p.deep ? '<span class="think">💭</span>' : ''}</div>
        <div class="stext q">${wrap(p.q)}</div>
        <div class="qchoices">${p.choices.map(([e, l], k) => `<button class="qc" type="button" data-k="${k}"><span class="qe">${illFor(e) || e}</span><span class="ql">${l}</span></button>`).join('')}</div></div>
        <div class="snav"><button class="iconbtn sprev" type="button" aria-label="Back">◀</button>${dots()}<button class="iconbtn sread" type="button" aria-label="Hear the question">🔊</button><button class="iconbtn snext" type="button" aria-label="Next page" disabled>▶</button></div>`;
      // choices stay in the order they are spoken
      box.querySelector('.sprev').addEventListener('click', () => { Sound.fx.flip(); go(pi - 1); });
      box.querySelector('.sread').addEventListener('click', () => Sound.say(id, { silentCaption: true }));
      box.querySelector('.snext').addEventListener('click', () => { Sound.fx.flip(); go(pi + 1); });
      box.querySelectorAll('.qc').forEach(b => b.addEventListener('click', () => answer(p, +b.dataset.k, b, back)));
      introIds = [id]; caption('');
      const my = tok; Sound.say([p.deep === 1 ? 'bk_think' : p.deep === 2 ? 'bk_one_more' : 'bk_qtime', id], { silentCaption: true });
      Sound.preload([id + '_yes', `${book.id}_${p.back}`]);
    }
    if (i + 1 < book.pages.length) Sound.preload([`${book.id}_${i + 1}`]);
  }
  async function answer(p, k, b, back) {
    if (box.querySelector('.qc.yes')) return;
    const my = tok, id = `${book.id}_${pi}`;
    if (k === p.ans) {
      b.classList.add('yes'); Sound.fx.match(); box.querySelectorAll('.qc:not(.yes)').forEach(x => x.classList.add('fade'));
      box.querySelector('.snext').disabled = false;
      await Sound.say(id + '_yes', { silentCaption: true }); if (my !== tok) return;
      box.querySelector('.snext').classList.add('nudge');
      await wait(900); if (my !== tok) return; go(pi + 1);
    } else {
      b.classList.add('no'); Sound.fx.wrong(); setTimeout(() => b.classList.remove('no'), 500);
      if (wrongOnce) { Sound.say(id, { silentCaption: true }); return; }
      wrongOnce = true;
      // replay the part of the story that has the answer, then ask again
      const peek = document.createElement('div'); peek.className = 'peek'; peek.innerHTML = `${art(back)}<div class="stext">${wrap(back.t)}</div>`;
      box.querySelector('.qpage').appendChild(peek); box.dataset.clip = `${book.id}_${p.back}`;
      await Sound.say(p.deep ? 'bk_again2' : 'bk_again', { silentCaption: true }); if (my !== tok) return;
      await Sound.say(`${book.id}_${p.back}`, { silentCaption: true }); if (my !== tok) return;
      peek.classList.add('out'); setTimeout(() => peek.remove(), 400); box.dataset.clip = id;
      Sound.say(id, { silentCaption: true });
    }
  }
  function finish() {
    tok++; box.innerHTML = `<div class="titlepage theend">${art({ scene: book.cover.scene, actors: [...book.cover.actors, ['⭐', 16, 20, 12, 'spin'], ['⭐', 84, 24, 10, 'spin']] })}<h2>The End</h2>
      <div class="row"><button class="big-btn again" type="button">Read it again</button><button class="big-btn alt more" type="button">📚 Another book</button></div></div>`;
    box.querySelector('.again').addEventListener('click', () => { Sound.fx.tap(); open(book); });
    box.querySelector('.more').addEventListener('click', () => { Sound.fx.tap(); shelf(true); });
    Sound.say('bk_end').then(() => api.win());
  }
  shelf(true);
  return () => { tok++; stopHL(); Sound.onStart = null; delete box.dataset.clip; };

function dotsGame(root, api) {
  let level = store.get('pr-dots-level', 10);
  chips('Dots', [[10, '1 to 10'], [20, '1 to 20']], level, v => { level = v; store.set('pr-dots-level', v); start(false); });
  const box = document.createElement('div'); box.className = 'dotgame'; root.appendChild(box);
  let pic, pts, nxt, dragging = false, done = false, timers = [], hintT = 0, lastFind = 0, run = 0;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const NS = 'http://www.w3.org/2000/svg';
  function choosePic() {
    let bag = store.get('pr-dots-bag', []).filter(k => DOT_PICS[k]);
    if (!bag.length) bag = shuffle(Object.keys(DOT_PICS));
    const k = bag.shift(); store.set('pr-dots-bag', bag); return k;
  }
  function start(intro) {
    timers.forEach(clearTimeout); timers = []; clearTimeout(hintT);
    pic = choosePic(); pts = placeDots(DOT_PICS[pic], level); nxt = 0; done = false; run++; box.classList.remove('reveal');
    const d = outlineD(DOT_PICS[pic]);
    const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const fs = level > 10 ? 4.6 : 5.6;
    box.innerHTML = `<svg class="dotsvg" viewBox="-8 -8 116 116"><g class="art pic-${pic}">${DOT_ART[pic](d)}</g><g class="lines"></g><line class="rubber" x1="0" y1="0" x2="0" y2="0"/>
      <g class="dts">${pts.map((p, i) => { const dx = p[0] - cx, dy = p[1] - cy, L = Math.hypot(dx, dy) || 1, o = 6.4;
        return `<g class="dt" data-i="${i}"><circle class="ring" cx="${p[0]}" cy="${p[1]}" r="4.6"/><circle class="dot" cx="${p[0]}" cy="${p[1]}" r="${level > 10 ? 2 : 2.4}"/><text x="${(p[0] + dx / L * o).toFixed(2)}" y="${(p[1] + dy / L * o).toFixed(2)}" font-size="${fs}">${i + 1}</text></g>`; }).join('')}</g></svg>`;
    svg = box.querySelector('svg'); lines = box.querySelector('.lines'); rubber = box.querySelector('.rubber');
    svg.addEventListener('pointerdown', down); svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
    hint(level === 10);
    const ids = ['dt_go']; introIds = intro ? ['dt_intro'] : ids;
    Sound.say(intro ? 'dt_intro' : ids);
    size();
  }
  let svg, lines, rubber;
  function hint(on) { box.querySelectorAll('.dt').forEach(g => g.classList.toggle('next', on && +g.dataset.i === nxt)); }
  function armHint() { clearTimeout(hintT); if (level > 10) { hint(false); hintT = setTimeout(() => hint(true), 6000); } else hint(true); }
  function toSvg(e) { const m = svg.getScreenCTM().inverse(); return [e.clientX * m.a + e.clientY * m.c + m.e, e.clientX * m.b + e.clientY * m.d + m.f]; }
  const R = () => level > 10 ? 5 : 6.5;
  function nearest(p) { let best = -1, bd = 1e9; pts.forEach((q, i) => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd) { bd = d; best = i; } }); return bd <= R() ? best : -1; }
  function line(a, b, cls = '') { const l = document.createElementNS(NS, 'line'); l.setAttribute('x1', a[0]); l.setAttribute('y1', a[1]); l.setAttribute('x2', b[0]); l.setAttribute('y2', b[1]); l.setAttribute('pathLength', 1); l.setAttribute('class', 'seg ' + cls); lines.appendChild(l); }
  function connect(i) {
    const g = box.querySelector(`.dt[data-i="${i}"]`); g.classList.add('done');
    if (i > 0) line(pts[i - 1], pts[i]);
    Sound.fx.count(i % 10); Sound.say('n_' + (i + 1));
    nxt = i + 1; armHint();
    if (nxt === pts.length) finish();
  }
  function down(e) {
    if (done) return;
    Sound.unlock(); const p = toSvg(e), i = nearest(p);
    if (i === nxt) connect(i);
    else if (i > nxt) { wrong(i); return; }
    dragging = true; try { svg.setPointerCapture(e.pointerId); } catch (er) {}
    move(e);
  }
  function move(e) {
    if (!dragging || done) return;
    const p = toSvg(e);
    if (nxt > 0) { rubber.setAttribute('x1', pts[nxt - 1][0]); rubber.setAttribute('y1', pts[nxt - 1][1]); rubber.setAttribute('x2', p[0]); rubber.setAttribute('y2', p[1]); rubber.classList.add('on'); }
    if (Math.hypot(pts[nxt][0] - p[0], pts[nxt][1] - p[1]) <= R()) connect(nxt);
  }
  function up() { dragging = false; rubber.classList.remove('on'); }
  function wrong(i) {
    const g = box.querySelector(`.dt[data-i="${i}"]`); g.classList.remove('nope'); void g.getBoundingClientRect(); g.classList.add('nope');
    Sound.fx.wrong(); hint(true);
    if (Date.now() - lastFind > 4000) { lastFind = Date.now(); later(() => Sound.say('dt_find'), 300); }
  }
  async function finish() {
    done = true; dragging = false; rubber.classList.remove('on'); clearTimeout(hintT); hint(false);
    const my = run, gone = () => !box.isConnected || my !== run;
    later(() => line(pts[pts.length - 1], pts[0]), 250);
    await wait(1100); if (gone()) return;
    box.classList.add('reveal'); Sound.fx.match();
    await wait(500); if (gone()) return;
    await Sound.say('dt_done_' + pic);
    if (gone()) return;
    later(() => api.win(), 900);
  }
  function size() { const s = Math.max(240, Math.min(root.clientWidth - 16, root.clientHeight - 16)); box.style.setProperty('--ds', s + 'px'); }
  start(true);
  const off = onResize(root, size);
  return () => { off(); timers.forEach(clearTimeout); clearTimeout(hintT); };
}

  c.svg.innerHTML = `<rect width="400" height="300" fill="#ffd9d6"/>${[...Array(14)].map((_, i) => `<g class="vi-rbc" style="animation-delay:${-i * .9}s;--y:${20 + (i * 47) % 260}px"><ellipse rx="16" ry="11" fill="#ff7a6b" opacity=".55"/><ellipse rx="7" ry="4" fill="#e85a4e" opacity=".5"/></g>`).join('')}
    <g transform="translate(14 12)"><rect width="88" height="70" rx="12" fill="#fff" stroke="${SCI_O}" stroke-width="2.4"/><g transform="translate(44 40)"><circle r="22" id="viFace" fill="#ffd9b8" stroke="${SCI_O}" stroke-width="2.4"/><circle cx="-7" cy="-3" r="2.6" fill="${SCI_O}"/><circle cx="7" cy="-3" r="2.6" fill="${SCI_O}"/><path id="viMouth" d="M-7 9 Q0 15 7 9" fill="none" stroke="${SCI_O}" stroke-width="2.2" stroke-linecap="round"/><g id="viTherm" opacity="0"><rect x="10" y="4" width="16" height="4" rx="2" fill="#fff" stroke="${SCI_O}" stroke-width="1.4"/><circle cx="10" cy="6" r="3" fill="#ff5a4e"/></g></g></g>
    <g id="viPoster" opacity="0"><rect x="150" y="84" width="100" height="112" rx="6" fill="#fff6d6" stroke="#c99400" stroke-width="3"/><text x="200" y="104" text-anchor="middle" class="sci-lbl">WANTED</text><g transform="translate(200 142) scale(1.8)">${VIR}</g><text x="200" y="188" text-anchor="middle" class="sci-lbl">this germ</text></g>
    <g id="viDefs"></g><g id="viVirs"></g><g id="viFx"></g>
    <g id="viVax" opacity="0" style="cursor:pointer"><circle cx="340" cy="246" r="34" fill="transparent"/><rect x="326" y="220" width="28" height="44" rx="6" fill="#e8f4ff" stroke="${SCI_O}" stroke-width="2.4"/><rect x="326" y="240" width="28" height="24" rx="4" fill="#7cc8ff"/><rect x="330" y="212" width="20" height="10" rx="3" fill="#ff7a6b" stroke="${SCI_O}" stroke-width="2"/><text x="340" y="282" text-anchor="middle" class="sci-lbl">Vaccine</text></g>`;
  const VS = c.$('#viVirs'), DS = c.$('#viDefs');
  const defs = [[120, 220], [240, 240], [300, 120]].map(([x, y]) => { const g = sciMk('g', {}, DS); g.innerHTML = DEF; return { g, x, y, tx: x, ty: y, target: null, badge: false }; });
  let virs = [], phase = 0, copyT = 0, said3 = false, fin = false;
  function spawn(x, y) { const g = sciMk('g', { class: 'vi-v', style: 'cursor:pointer' }, VS); g.innerHTML = `<circle r="22" fill="transparent"/>${VIR}`; const v = { g, x, y, vx: (Math.random() - .5) * 30, vy: (Math.random() - .5) * 30, marked: false, dead: false }; virs.push(v); g.addEventListener('pointerdown', ev => { ev.stopPropagation(); mark(v); }); return v; }
  function mark(v) { if (v.dead || v.marked || phase !== 1) return; c.noHand(); v.marked = true; v.g.classList.add('vi-mark'); Sound.fx.tap(); const free = defs.filter(d => !d.target || d.target.dead).sort((a, b) => Math.hypot(a.x - v.x, a.y - v.y) - Math.hypot(b.x - v.x, b.y - v.y))[0]; if (free) free.target = v; }
  function sick(on) { c.$('#viFace').setAttribute('fill', on ? '#dff0c8' : '#ffd9b8'); c.$('#viMouth').setAttribute('d', on ? 'M-7 12 Q0 6 7 12' : 'M-7 9 Q0 15 7 9'); c.$('#viTherm').setAttribute('opacity', on ? 1 : 0); }
  function eat(d, v) { v.dead = true; d.target = null; Sound.fx.bubble(); v.g.classList.add('vi-gulp'); setTimeout(() => v.g.remove(), 450); const s = sciMk('text', { x: v.x, y: v.y - 14, class: 'vi-pop', 'text-anchor': 'middle' }, c.$('#viFx')); s.textContent = '✨'; setTimeout(() => s.remove(), 700); }
  c.loop(dt => {
    const live = virs.filter(v => !v.dead);
    live.forEach(v => { v.x += v.vx * dt; v.y += v.vy * dt; if (v.x < 30 || v.x > 380) v.vx *= -1; if (v.y < 100 || v.y > 280) v.vy *= -1; v.x = Math.max(30, Math.min(380, v.x)); v.y = Math.max(100, Math.min(280, v.y)); v.g.setAttribute('transform', `translate(${v.x.toFixed(1)} ${v.y.toFixed(1)})`); });
    if (phase === 1) { copyT += dt; if (copyT > 6 && live.length && live.length < 9) { copyT = 0; const p = live[Math.floor(Math.random() * live.length)]; const n = spawn(p.x + 16, p.y + 8); n.g.classList.add('vi-copy'); } }
    if (phase === 1) defs.forEach(d => { if (!d.target || d.target.dead) d.target = live.find(v => v.marked && !defs.some(o => o.target === v)) || null; });
    if (phase === 3) defs.forEach(d => { if (!d.target || d.target.dead) d.target = live.filter(v => !defs.some(o => o.target === v))[0] || null; });
    defs.forEach(d => {
      const speed = phase === 3 ? 260 : 120;
      if (d.target && !d.target.dead) { d.tx = d.target.x; d.ty = d.target.y; } else if (Math.hypot(d.tx - d.x, d.ty - d.y) < 4) { d.tx = 60 + Math.random() * 280; d.ty = 110 + Math.random() * 160; }
      const dx = d.tx - d.x, dy = d.ty - d.y, dist = Math.hypot(dx, dy) || 1, sp = d.target ? speed : 30;
      d.x += dx / dist * Math.min(dist, sp * dt); d.y += dy / dist * Math.min(dist, sp * dt);
      d.g.setAttribute('transform', `translate(${d.x.toFixed(1)} ${d.y.toFixed(1)})`);
      if (d.target && !d.target.dead && dist < 14) eat(d, d.target);
    });
    if ((phase === 1 || phase === 3) && virs.length && !virs.some(v => !v.dead)) {
      if (phase === 1) { phase = 1.5; sick(false); Sound.fx.win(); (async () => { await c.say('sc_vi_3'); if (c.isDone()) return; phase = 2; c.$('#viVax').setAttribute('opacity', 1); c.$('#viVax').classList.add('vi-glow'); c.hand(340, 250); await c.say('sc_vi_4'); })(); }
      
    }
    return true;
  });
  c.on(c.$('#viVax'), 'pointerdown', async e => {
    e.stopPropagation(); if (phase !== 2) return; phase = 2.5; c.noHand(); Sound.fx.magic(); c.$('#viVax').classList.remove('vi-glow');
    c.$('#viPoster').setAttribute('opacity', 1); c.$('#viPoster').classList.add('vi-posterin');
    defs.forEach((d, i) => { d.tx = 160 + i * 40; d.ty = 238; d.target = null; });
    c.later(() => defs.forEach(d => { d.g.insertAdjacentHTML('beforeend', '<text class="vi-badge" x="8" y="-12">⭐</text>'); }), 1400);
    await c.say('sc_vi_5');
    c.$('#viPoster').setAttribute('opacity', 0); phase = 3; sick(false);
    for (let i = 0; i < 6; i++) spawn(40 + Math.random() * 320, 110 + Math.random() * 160);
    c.say('sc_vi_6').then(() => { if (!fin) { fin = true; c.finish([]); } });
  });
  c.intro(['sc_vi_1']).then(() => {
    if (fin) return; phase = 1; sick(true); for (let i = 0; i < 6; i++) spawn(60 + Math.random() * 300, 120 + Math.random() * 150);
    c.hand(virs[0].x, virs[0].y + 10); c.say('sc_vi_2');
  });
}

function scienceGame(root, api) {
  const box = document.createElement('div'); box.className = 'sci'; root.appendChild(box);
  const backBtn = document.createElement('button'); backBtn.type = 'button'; backBtn.className = 'chip'; backBtn.textContent = '🔬 All experiments'; backBtn.hidden = true;
  backBtn.addEventListener('click', () => { Sound.fx.tap(); picker(true); }); tools.appendChild(backBtn);
  let tok = 0, cleanups = [];
  const doneMap = store.get('pr-sci-done', {});
  function stop() { tok++; cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; Sound.stopVoice(); }
  function picker(talk) {
    stop(); backBtn.hidden = true;
    box.innerHTML = `<div class="sci-grid">${SCI_TOPICS.map((t, i) => `<button class="sci-card${doneMap[t.id] ? ' done' : ''}" type="button" data-i="${i}"><span class="sci-ic" style="background:${t.bg}">${t.icon}</span><span class="sci-nm">${t.name}</span>${doneMap[t.id] ? '<span class="sci-ck">⭐</span>' : ''}</button>`).join('')}</div>`;
    box.querySelectorAll('.sci-card').forEach(b => b.addEventListener('click', () => { Sound.fx.tap(); open(SCI_TOPICS[+b.dataset.i]); }));
    introIds = ['sc_pick']; if (talk) Sound.say('sc_pick');
  }
  function open(t) {
    stop(); backBtn.hidden = false; const my = tok; subLabel = t.name;
    box.innerHTML = `<div class="sci-wrap"><div class="sci-stage sci-${t.id}"><svg class="sci-svg" viewBox="0 0 400 300"></svg><svg class="sci-hand" viewBox="0 0 400 300"><text class="hand" x="0" y="0">👆</text></svg></div></div>`;
    const stage = box.querySelector('.sci-stage'), svg = stage.querySelector('.sci-svg'), handT = stage.querySelector('.hand');
    const alive = () => my === tok && box.isConnected;
    let t0 = 0, finished = false;
    const c = {
      root: stage, svg,
      $: s => svg.querySelector(s),
      pt(e) { const m = svg.getScreenCTM().inverse(); return [e.clientX * m.a + e.clientY * m.c + m.e, e.clientX * m.b + e.clientY * m.d + m.f]; },
      on(el, ev, fn) { el.addEventListener(ev, fn); cleanups.push(() => el.removeEventListener(ev, fn)); },
      later(fn, ms) { const id = setTimeout(() => { if (alive()) fn(); }, ms); cleanups.push(() => clearTimeout(id)); },
      loop(fn) { let last = performance.now(), start = last, raf; const step = now => { if (!alive()) return; const dt = Math.min(.05, (now - last) / 1000); last = now; c._age = (now - start) / 1000; if (fn(dt)) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); cleanups.push(() => cancelAnimationFrame(raf)); },
      age() { return c._age || 0; },
      tween(fn, ms) { return new Promise(res => { const s = performance.now(); const step = now => { if (!alive()) return res(); const k = Math.min(1, (now - s) / ms); fn(k); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); }); },
      drag(el, h) {
        let on = false;
        c.on(el, 'pointerdown', e => { on = true; e.stopPropagation(); try { el.setPointerCapture(e.pointerId); } catch (er) {} h.start && h.start(c.pt(e)); });
        c.on(el, 'pointermove', e => { if (on) h.move && h.move(c.pt(e)); });
        const up = () => { if (on) { on = false; h.end && h.end(); } };
        c.on(el, 'pointerup', up); c.on(el, 'pointercancel', up);
      },
      say(ids) { if (!alive()) return Promise.resolve(); return Sound.say(ids); },
      async intro(ids) { introIds = ids.slice(-1); await c.say(ids); },
      hand(x, y) { handT.setAttribute('x', x - 10); handT.setAttribute('y', y + 26); handT.classList.add('on'); },
      noHand() { handT.classList.remove('on'); },
      isDone: () => finished,
      async finish(lines) {
        if (finished) return; finished = true; c.noHand();
        if (lines.length) await c.say(lines); if (!alive()) return;
        doneMap[t.id] = true; store.set('pr-sci-done', doneMap);
        await c.say('sc_great'); if (!alive()) return;
        api.win();
      },
    };
    t.run(c);
  }
  picker(true);
  return () => stop();
}

  if (g.spend) b.classList.add('spend');
  b.innerHTML = `<span class="art${g.tight ? ' tight' : ''}" style="background:${g.bg}">${g.art}</span><span class="name">${g.name}</span>${g.spend ? '<span class="spendbadge"><svg viewBox="0 0 24 24"><use href="#starArt"/></svg>Spend <span class="yr">your </span>stars here! <b class="starN">0</b></span>' : ''}`;
  b.addEventListener('click', () => { Sound.unlock(); Sound.fx.tap(); openGame(g.id); });
  tilesEl.appendChild(b);
});
const voiceBtn = $('#voiceBtn'), sfxBtn = $('#sfxBtn');
function syncToggles() { voiceBtn.setAttribute('aria-pressed', String(Sound.voiceOn)); sfxBtn.setAttribute('aria-pressed', String(Sound.sfxOn)); }
voiceBtn.addEventListener('click', () => { Sound.voiceOn = !Sound.voiceOn; syncToggles(); });
sfxBtn.addEventListener('click', () => { Sound.sfxOn = !Sound.sfxOn; syncToggles(); Sound.fx.tap(); });
syncToggles(); showStars();
$('#shelfStars').addEventListener('click', () => { Sound.unlock(); Sound.fx.tap(); openGame('tree'); });

$('#pipHome').addEventListener('click', e => pokePip(e.currentTarget));
$('#pipSplash').addEventListener('click', e => pokePip(e.currentTarget));
$('#goBtn').addEventListener('click', () => {
  Sound.unlock(); Sound.fx.win();
  $('#splash').hidden = true; $('#shelf').hidden = false;
  Sound.say('welcome');
  const ph = $('#pipHome .pip'); ph.classList.add('flyin'); setTimeout(() => ph.classList.remove('flyin'), 1600);
  Sound.preload(['hub', 'star', ...PRAISE, ...TRY]);
});
applyWear();
Sound.preload(['welcome', ...PIP_LINES, 'pip_spin', 'pip_fly', 'pip_dance']);
{ const sp = $('#pipSplash .pip'); sp.classList.add('flyin'); setTimeout(() => sp.classList.remove('flyin'), 1600); }
// after a quiet fresh start (see freshStart), go straight back to the game shelf
// A heartbeat notes where the app is every few seconds. If the page starts again soon after (because Safari reloaded it),
// skip the welcome screen and go straight back to the game shelf, and leave a small note saying what happened.
const HB = 'pr-hb';
function beat(extra) {
  try { localStorage.setItem(HB, JSON.stringify(Object.assign({ t: Date.now(), g: current ? current.name : '', s: subLabel, v: document.visibilityState,
    p: played, b: bootT }, extra || {}))); } catch (e) {}
}
function hideRestartNote() { const n = $('#restartNote'); if (n) n.hidden = true; }
(function resume() {
  let fresh = null, hb = null;
  try { fresh = sessionStorage.getItem('pr-fresh'); sessionStorage.removeItem('pr-fresh'); } catch (e) {}
  try { hb = JSON.parse(localStorage.getItem(HB) || 'null'); } catch (e) {}
  const recent = hb && Date.now() - hb.t < 30 * 60e3;
  if (fresh || recent) { $('#splash').hidden = true; $('#shelf').hidden = false; caption(TEXT.hub); Sound.preload(['hub', 'star', ...PRAISE, ...TRY]); }
  if (!fresh && recent && !hb.clean) {
    const where = [hb.g, hb.s].filter(Boolean).join(' › ') || 'the game shelf', mins = Math.max(1, Math.round((hb.t - hb.b) / 60e3));
    const how = hb.v === 'hidden' ? 'while the app was in the background' : 'during play';
    const note = `The page restarted ${how} (in ${where}, after about ${mins} min).`;
    const n = $('#restartNote'); n.textContent = note; n.hidden = false;
    try { const log = JSON.parse(localStorage.getItem('pr-restarts') || '[]'); log.push(new Date().toLocaleString() + ': ' + note); localStorage.setItem('pr-restarts', JSON.stringify(log.slice(-10))); } catch (e) {}
  }
})();
beat(); setInterval(() => beat(), 4000);
document.addEventListener('visibilitychange', () => beat());
addEventListener('pagehide', () => beat({ clean: !sessionStorage.getItem('pr-fresh') }));
if (window.speechSynthesis) speechSynthesis.getVoices();
})();
