name: iOS build
# Builds the iPhone/iPad app and uploads it to App Store Connect (TestFlight), ready to submit for review.
# Until the App Store Connect key secrets are added, it only checks that the app compiles.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', 'index.html', 'audio/**', '.github/workflows/ios.yml']
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Use Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
      - name: Put the web app into the iOS project
        working-directory: app
        run: npm ci && node scripts/sync-web.mjs && npx cap sync ios
      - name: Check for the App Store Connect key
        id: keys
        env: { ASC_KEY_ID: '${{ secrets.ASC_KEY_ID }}' }
        run: |
          if [ -n "$ASC_KEY_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::No App Store Connect key in the repository secrets yet, so this run only checks that the app compiles."; fi
      - name: Compile check (no signing)
        if: steps.keys.outputs.ok != '1'
        working-directory: app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { grep -E "error:|warning: .*fail" build.log | head -40 > err.txt; [ -s err.txt ] || tail -40 build.log > err.txt; echo "::error title=iOS build failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' err.txt)"; exit 1; }
          tail -5 build.log
      - name: Register the app ID
        if: steps.keys.outputs.ok == '1'
        env:
          ASC_KEY_ID: '${{ secrets.ASC_KEY_ID }}'
          ASC_ISSUER_ID: '${{ secrets.ASC_ISSUER_ID }}'
          ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}'
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 app/scripts/asc_prepare.py
      - name: Build, sign and upload to App Store Connect
        if: steps.keys.outputs.ok == '1'
        working-directory: app/ios/App
        env:
          ASC_KEY_ID: '${{ secrets.ASC_KEY_ID }}'
          ASC_ISSUER_ID: '${{ secrets.ASC_ISSUER_ID }}'
          TEAM: '${{ secrets.APPLE_TEAM_ID }}'
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > archive.log 2>&1 || { grep -E "error:|requires a provisioning|No profiles|No signing" archive.log | head -40 > err.txt; [ -s err.txt ] || tail -40 archive.log > err.txt; echo "::error title=iOS archive failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' err.txt)"; exit 1; }
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > export.log 2>&1 || { grep -iE "error" export.log | head -40 > err.txt; [ -s err.txt ] || tail -40 export.log > err.txt; echo "::error title=iOS upload failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' err.txt)"; exit 1; }
          tail -15 export.log
          echo "Uploaded build ${{ github.run_number }} to App Store Connect. It shows up under TestFlight after Apple finishes processing it."
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
